[[conflict]]
a = "er-quickload"
b = "er-quit-menu"
kind = "duplicate-owner"
reason = """Both arm the System>Quit rows, from the same code: since 2026-09-11 the cloner, the row router and the three routing detours live in `er-quit-menu-core`, and each DLL calls `er_quit_menu_core::row_cloner::arm` with its own row set. Two arms in one process is two of everything that call installs -- two `AddCancelButton` registrations appending two sets of rows to one dialog, two row tables writing one set of telemetry counters, and two claims on the three routing prologues. The union makes the detours chain rather than trample, which is why this is a duplicate OWNER rather than a hook collision: the damage is the second set of rows, not a corrupted trampoline.

The `02_040` grid settles it on its own. Both derive the six-cell Quit panel from the game's own vanilla payload, and `er_gfx::options_02_040::quit6` fail-closes when its input is not vanilla (`Quit6Error::KnownInputBadOutput`, asserted by `crates/er-gfx/tests/options_02_040.rs`). Whichever deriver runs second is handed already-derived bytes and correctly refuses -- so co-loading cannot produce a working tab, only a fail-closed log line and whichever half of the pair happened to win.

The product DLL is the one to keep. The shell exists for a profile that does not load it, and it arms `RowSet::BUILD_ROWS_ONLY`: the two build rows, and none of the four whose flows only a product has."""
evidence = "crates/er-quit-menu/src/lib.rs; crates/er-quit-menu-core/src/row_cloner.rs; crates/er-quickload/src/experiments/startup_hooks/diagnostics/layout_global_hooks.rs"

[[conflict]]
a = "er-build-import"
b = "er-quit-menu"
kind = "duplicate-owner"
reason = """The same two-owners-of-one-mutation this table already records between `er-build-import` and the product, for the same reason: both link `er-build-import-runtime`, whose statics are per DLL, and both now register a `CSTaskImp` FrameBegin task that drives its phase machine. The shell imports the configured `build_url` unprompted at character load; the quit-menu shell imports on demand from the **Load Build from URL** row. Two copies of the phase machine, two fetch workers and two tasks mutating one character's inventory, equipment slots and PlayerGameData, with no shared lock.

This entry became true on 2026-09-11, when `er-quit-menu` stopped being a harness that armed nothing. Its `[compatible]` note predicted exactly this: "if the harness ever arms that row, this entry becomes a `duplicate-owner` conflict with `er-build-import` and with `er-quickload`"."""
evidence = "crates/er-build-import/src/lib.rs:23; crates/er-quit-menu-core/src/game_task.rs"

[[conflict]]
a = "er-quickload"
b = "er-quit-rows"
kind = "duplicate-owner"
reason = """`er-quit-rows` is a copy of `er-quickload`'s source being reduced to the System>Quit rows, so until that reduction finishes the two are duplicate owners of everything the product owns, not of one surface: the same row cloner arm, the same three routing prologues, the same row-populate and current-summary detours, the same save-redirect hooks, the same autoload phase machine and the same telemetry counters. Every static is per DLL, so co-loading gives each of those two independent copies with no shared lock.

It was duplicated rather than extracted on 2026-09-11 by user directive, after the opposite approach was measured and rejected. `er-quit-load-character` had been built UP from shared crates, and run `br-20260911-205138-default` reached a shell where every moved code path executed and the surface still looked and behaved nothing like the product: right rows, wrong GFX content, no styling, no inserted elements, and a save-file click that did not interact like the product's. Starting from a copy means parity is the default and only what is deleted is lost.

This entry is expected to narrow as the reduction proceeds, but it must never be deleted: even fully reduced, both shells arm the same Quit grid, and `er_gfx::options_02_040::quit6` fail-closes when handed already-derived bytes."""
evidence = "crates/er-quit-rows/src/lib.rs; crates/er-quickload/src/lib.rs; bd build-a-feature-dll-down-from-quickload-not-up-2026-09-11"

