[[shared]]
a = "er-quickload"
b = "er-hotkey-conflicts"
target = "IDirectInputDevice8::GetDeviceState (dinput8.dll device vtable slot 9)"
mechanism = "hook-union"
handler_a = "dinput_kb_get_state_hook"
handler_b = "hook_get_device_state"
reason = """A FOURTH shell on the DirectInput keyboard `GetDeviceState` slot -- and the only \
one whose whole purpose is to report the class of bug a private MinHook instance on this prologue \
causes. It observes and nothing else: the detour calls the rest of the chain, records that SOME \
module read the keyboard, copies the returned buffer for a consumption check, and returns the \
chain's value untouched. It never blanks a key, never writes the buffer and never injects.

Registered through `er_hook::register_shared_hook_with_budget`, spelled out at the install site \
rather than behind a helper so `check-shared-hook-rvas.py` can see the registrar beside the \
handler and a revert to a private instance goes red instead of silently disabling one of the \
three shells above.

Note what it cannot do, which is why it does not make the other rows redundant: `GetDeviceState` \
returns all 256 scancodes at once, so this DLL can say WHICH MODULES read the keyboard and never \
WHICH KEY any of them is bound to. Its exact `(module, key)` findings come from the \
argument-carrying user32 surfaces instead."""
evidence = """crates/er-hotkey-conflicts/src/hooks.rs `register_shared_hook_with_budget(keyboard, \
hook_get_device_state, &DINPUT_GET_STATE_ORIG, ...)`, resolved from the same probe device \
(`probe_device_state_address` on `GUID_SysKeyboard`, vtable slot 9) as the three shells above."""

