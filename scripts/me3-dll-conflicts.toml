NOT YET RUNTIME-PROVEN. The chain is decoded and byte-checked in both images and the DLL builds \
clean, but no live run has yet shown a character moving under an unfocused window. Until one has, \
treat this entry as a static-evidence classification."""

"er-invasion-warp" = """PROMOTED OUT OF [[conflict]] 2026-09-04, after the mechanism behind \
`0x140010043` was identified and REMOVED rather than merely failing to reappear. This entry keeps \
the old row's evidence because the demotion has to be auditable, and because the row was demoted \
once before on weaker grounds and had to be restored.

WHAT THE ROW SAID. Six crashes, deterministic at ~30s with the product co-loaded: \
`exception code=0xc000001d (STATUS_ILLEGAL_INSTRUCTION) addr=0x140010043{game+0x10043}`, a \
MID-INSTRUCTION RIP two bytes into the game's SSE memcpy leaf at `0x140010000`, with \
`context_rcx == context_rip == 0x140010043` -- the signature of a call THROUGH A POINTER holding \
the faulting address. A bisect isolated this shell: product alone clean past 106s, \
`er-invasion-path` alone clean past 114s, this one alone +29.9s. The row correctly refused to \
demote on two clean runs in 2026-09-03, and correctly restored itself when the repeat crashed at \
`+30436ms` with a valid slot.

THE MECHANISM, found 2026-09-04. The fault is TIME-triggered, not action-triggered: five records \
land at 43.8-56.1s regardless of activity and one arrived with nothing pressed at all, so no user \
action was ever the variable. What WAS the variable is that `local_invasion_filter` reached \
Seamless's session through two MinHook detours INTO `ersc.dll`. Either detour armed faults; \
neither armed is clean. MinHook registers no unwind info for its trampolines (nothing in \
`vendor/minhook/` calls `RtlAddFunctionTable`), and `ersc.dll` is Themida-virtualised, which is \
enough to make a detour there a wild control transfer rather than a chained call.

THE FIX, and why it removes the cause instead of hiding it. `scan_for_session` \
(`crates/er-invasion-warp/src/local_invasion_filter.rs`) walks the WRITABLE sections of ersc's own \
image and identifies the session by its state signature, which is the only thing the detours \
existed to observe. `ersc_observers` now defaults FALSE. So the filter keeps working with ZERO \
detours into `ersc.dll` -- measured live: `session resolved WITHOUT hooking Seamless -- found at \
0x1801b2560 via a pointer in ersc's own writable data at 0x18021a640`.

THE RUN. 2026-09-04, autoload route, `er_quickload.dll` + `er_invasion_warp.dll` + \
`er_crash_logging.dll` + the game-installed `ersc.dll` (Seamless v2.0.1), \
`local_invasion.enabled = true`, character LGS: 600 seconds, `fault_records=0 panic_lines=0 \
hang_report=false process_alive=true`. That is TWENTY TIMES the ~30s window every historical crash \
landed inside.

WHAT THIS RESTS ON, stated plainly: ONE 600s run, plus an identified and removed cause. The \
2026-09-03 demotion failed because it had clean runs and no mechanism; this one has the mechanism. \
If it is still wrong the failure is loud and immediate -- `0x140010043` inside the first minute -- \
so a single launch re-falsifies it. Restore the `[[conflict]]` row if that happens, and do not \
re-demote on absence alone."""

