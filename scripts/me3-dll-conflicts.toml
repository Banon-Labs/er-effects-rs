# ---------------------------------------------------------------------------
# Shells with NO known conflict at all. A reason is mandatory: "no conflict" must be a
# finding someone made, not a default that a new crate inherits by being forgotten.
#
# `er-quickload` is deliberately absent. It is the axis every conflict above is
# expressed against, so it is already classified by appearing in those pairs -- and
# listing it here would assert it is conflict-free, which is the opposite of true.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# CO-LOADABLE, BUT NEVER AUTO-INCLUDED. These DLLs corrupt nothing -- they would each pass
# [compatible] on the merits -- but they CHANGE WHAT THE PLAYER SEES, and a dependency-closure
# walk is not consent. `er-dll-closure.py` drops them unless the caller names them with `--with`.
#
# The failure this exists to stop, 2026-08-23: mushroom-man-runtime was classified [compatible]
# (true: it patches protector param rows, hooks nothing), so a branch that touched a crate it
# transitively depends on pulled it into the closure, and `er-run-branch.py` launched the user's
# game with a mushroom mod they had already removed by hand from their own profile. The run was
# not the run they asked for, and the only remedy was killing the session.
#
# A reason is mandatory and must say WHAT THE PLAYER WOULD SEE, not what the code does -- the
# whole point is that the code being harmless is not the question.
# ---------------------------------------------------------------------------
[opt_in_only]
"mushroom-man-runtime" = """Replaces a protector's param rows so the character wears the mushroom \
head -- a VISIBLE costume change on whatever character the run loads. Harmless to the process \
and hooks no prologue, which is exactly why it slipped in: co-loadable is not the same as \
wanted. Load it only when the mushroom IS the experiment: `--with mushroom-man-runtime`."""

"er-death-persist" = """Patches SpEffectParam / SpEffectVfxParam rows (saveCategory 5 -> 3 on \
19980/19981/19982, plus their cycle-chain and VFX flags) from a CSTaskImp task at boot. It hooks \
NOTHING -- no MinHook instance, no union entry, no VirtualProtect -- and that is precisely why it \
sat in [compatible] for so long: it cannot corrupt another DLL's trampolines, so every \
prologue-based check called it safe. It still LOCKS THE PLAYER OUT OF SEAMLESS INVASIONS.

MECHANISM. Seamless filters its lobby list on `lobby_key` with k_ELobbyComparisonEqual, and that \
key is a SHA256 fingerprint of the PARAM TABLES (BuildLobbyKey @ ersc 0xABC20). It re-derives on \
a jittered timer AFTER this DLL's boot task has run, so the PATCHED fingerprint is what gets \
published and filtered on -- and nobody else in the world has it. A search against a pool of one \
finds nobody.

The RULE survives a Seamless update; the ADDRESS does not. `0xABC20` and the SHA256 values below \
were measured against ersc.dll v1.9.9. Seamless Co-op v2.0.0 (2026-09-02) moved its entry points, \
and a body search for BuildLobbyKey there returns two candidates plus a third whose prologue \
matches -- ambiguous, so it is unverified rather than relocated. That does not weaken this \
conflict: param-table divergence locking you out of matchmaking is Seamless's design, not an \
artifact of one build. It only means nothing should ACT on the number without re-measuring \
(scripts/locate-ersc-entry-points.py; scripts/ersc_identify.py reports the installed build). \
Tracked in bd er-effects-rs-wqzf.

MEASURED TWICE, byte-identical two days apart (2026-08-23 A/B; reconfirmed live 2026-08-25 on the \
user's own save and the full 14-DLL pack):
  with it     LOBBY KEY = 0044f570d958f07ace546a90fa62ba2044ef7c3a1f9864fb3cb336bf611965d3
  without it  LOBBY KEY = 16ca67264987f56ca821525a2f65884cedc2546cf15ca3e69292c5c394c9d4ef
With it dropped, the user invaded on the next attempt.

WHY DEFAULT-OFF RATHER THAN A [[conflict]]: nothing crashes, nothing logs an error and no \
prologue is contended, so there is no pair to rank. The failure is INVISIBLE and looks exactly \
like "no hosts online" -- the worst possible way for a DLL to arrive uninvited on a \
dependency-closure walk. Load it only when death-persistence IS the experiment, and expect not to \
invade during that run: `--with er-death-persist`."""

[compatible]
"er-convenient-deaths" = """CO-LOADABLE WITH EVERYTHING, INCLUDING THE PRODUCT, and the reason is \
structural rather than a run that happened to survive: this shell INSTALLS NO DETOUR. Its whole \
effect is three one-byte stores into `.text`, from its own install thread, after which the thread \
exits and nothing here runs again for the session. Neither failure mode this table exists to \
catch can arise -- no second MinHook instance can overwrite a trampoline it never installed, and \
no D3D12 Present/compositor is touched.

WHICH BYTES, AND WHO ELSE COULD WANT THEM. The three sites are 1.16.2 `0x5fc0c0+0x0` (the \
bloodstain writer's entry), `0x25e1e0+0x9` (the rune-arc clear's 16-bit store) and \
`0x5a6fb0+0x11d` (the `MenuCommonParam` null-check inside `SoloPlayDeath`). No other crate in \
this workspace declares any of the five addresses involved -- verified 2026-09-09 through \
`scripts/rva_symbols.py`, which keys on resolved VALUES rather than names, so the claim is \
checkable and not a naming coincidence.

WHAT HAPPENS IF SOMETHING ELSE DOES OWN ONE. It is reported, not silently lost. Each patch \
compares the live window byte-for-byte against a constant `build.rs` generated from named \
`iced-x86` instructions before writing, and reads the byte back afterwards; a mod that got there \
first fails the first check and the patch DISARMS, and a mod that arrives later cannot corrupt \
anything of ours because there is no trampoline to overwrite -- the byte is simply theirs.

RELATIONSHIP TO er-seamless-bugfixes, which is the shell a reader will suspect, since it is the \
only other crate that writes game code. Its single patch is the freelist shutdown assert at \
1.16.2 `0xc57670`, which is nowhere near these three, and it reaches its address the same way \
(`resolve_call_site_rva`, window check, one byte, read back). The two are independent by address \
and identical in mechanism.

DEFAULT-OFF, WHICH IS NOT A CONFLICT ARGUMENT BUT IS WORTH KNOWING: all three patches stay \
unapplied unless a DLL-adjacent config key asks for one, so a profile that includes this shell \
without editing that file changes no byte at all."""
"er-focus-input" = """CO-LOADABLE WITH EVERYTHING, INCLUDING THE PRODUCT, and the reason is \
structural rather than a run that happened to survive: this shell INSTALLS NO DETOUR. Its entire \
effect is one byte store, from the game thread, into the `.data` global behind \
`Game.Debug.IsEnableControlOnDisactiveWindow` -- 1.16.2 RVA `0x4588af1`, read by the single \
instruction `movzx eax, byte ptr [0x144588af1]` at `0x1402e6853`. There is no prologue to contend \
with, so the two failure modes this table exists to catch cannot arise: no second MinHook instance \
can overwrite a trampoline it never installed, and no D3D12 Present/compositor is touched.

WHAT IT WRITES, AND WHO ELSE COULD WANT IT. Ghidra reports exactly ONE reader of that byte (the \
getter above) and exactly TWO callers of the getter: `CS::CSPadStep::STEP_Update` (`0x140e33aa0`, \
