comes from `GetPropertyBoolean(props, "Ext.UserInput.CooperativeLevel.SetForeGround.Pad", false)` -- \
a debug system property that a retail build does not set. Different byte, different consumer, no \
contention. Load both, or either alone.

WHAT IT CHANGES FOR A USER, stated plainly so nobody is surprised: with this DLL loaded the game \
keeps reading pad and mouse input while its window is in the background. That is the point, and it \
