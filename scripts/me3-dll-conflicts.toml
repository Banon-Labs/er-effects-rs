# Which ME3-loadable DLLs must never share one profile, and why.
#
# This table exists because the knowledge used to live ONLY as prose in a hand-written
# profile (`~/Elden/main-all-dlls.me3`), where nothing could enforce it. A generated
# profile that co-loads a conflicting pair produces a run that is corrupt before it
# starts -- two MinHook instances detouring the same prologue overwrite each other's
# trampolines, two D3D12 Present compositors fight over the swapchain -- and the
# resulting evidence looks like a feature bug rather than a loader bug.
#
# CONSUMED BY  scripts/er-dll-closure.py  (refuses to emit a conflicting profile)
# GATED BY     scripts/check-me3-dll-conflicts.py  (proves this table covers every shell
#              in the `me3_shells` array of scripts/check-rust-build.sh, so adding a new
#              cdylib cannot silently skip conflict analysis)
#
# Every package listed in `me3_shells` must appear here EITHER in a [[conflict]] pair OR
# in [compatible] with a reason. Silence is not an answer: an unanalyzed DLL is exactly
# the one that gets auto-included by a dependency-closure walk.
#
# There is a THIRD state, [[shared]]: two DLLs that both detour one prologue but have been made
# safe by routing through a single MinHook instance (the hook union). A [[shared]] pair is
# co-loadable -- `er-dll-closure.py` reads [[conflict]] only -- and each of its members is still
# classified by [compatible]. It exists so `check-shared-hook-rvas.py` can tell a DECLARED,
# mechanism-backed sharing apart from an accidental one, and so reverting either side to a bare
# hook fails a gate instead of silently disabling a feature.
#
# `kind` is the failure mode, not a severity. All conflicts are blocking -- the point of
# generating a profile is that you learn what is wrong BEFORE the run, not after.

[[shared]]
a = "er-quickload"
b = "er-armament-icons"
target = "er_game_base::rva::TITLE_SCALEFORM_FILE_OPEN_RVA"
mechanism = "hook-union"
# The two detours on that prologue, aligned with `a` and `b`. These are what the gate PROVES: each
# must be handed to a union registrar and must never appear in an `MhHook::new(...)` call, so a
# revert to a private MinHook instance fails a check instead of silently disabling a feature.
handler_a = "title_scaleform_file_open_observer_hook"
handler_b = "file_open_hook"
reason = """RESOLVED 2026-08-23, was a `hook-collision`. Both DLLs detour the SAME Scaleform \
LoaderImpl file-open prologue (0x11ced80), and each links `er-hook` statically -- so each owned a \
SEPARATE MinHook instance and whichever installed second overwrote the other's trampoline. \
RUNTIME-MEASURED: in an 11-native profile the product reported file_open_observer_installed = true \
and file_open_hits = 0 for a whole session, and EVERY GFx swap it owns went silently inert -- the \
System>Quit tab rendered vanilla, plus the title strip, the 05_010 stats panel and both 02_990 \
text-input movies. Loaded ALONE the same build reported 113 hits. Nothing crashed and nothing \
logged an error, so the loader bug wore a feature bug's clothes for a full day.

THE FIX, both sides, so install ORDER cannot decide it: the product registers its observer through \
`er_hook::register_union_hook` instead of a bare `MhHook`, and the companion registers through \
`er_hook::register_shared_hook`, which resolves the product's `er_effects_union_register` export \
and chains into that single instance (falling back to its own union when the product is absent, so \
a standalone armament-icons run is unchanged). Whoever registers first creates the dispatcher and \
owns the real trampoline; the other CHAINS. Both handlers are now UNION-SHAPED -- four `usize` \
args, calling their `orig` slot through the same signature, because that slot may hold the next \
handler rather than the game trampoline.

This pair is therefore CO-LOADABLE and `er-dll-closure.py` may emit both; it reads `[[conflict]]` \
only. It is recorded here so `check-shared-hook-rvas.py` can prove the sharing is DECLARED rather \
than accidental, and so a future edit that reverts either side to a bare hook is a gate failure \
rather than another silent day."""
evidence = "crates/er-armament-icons/src/gfx_equip_hook.rs (register_shared_hook); crates/er-quickload/src/experiments/startup_hooks/loading_cover/title_resources_stats_text.rs (register_union_hook); crates/er-hook/src/lib.rs (register_shared_hook)"

