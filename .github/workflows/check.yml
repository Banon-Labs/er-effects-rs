name: check

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger to re-warm the main-scoped tool caches (cupcake, xwin
  # CRT/SDK, rust-cache) if GitHub evicts them after an idle week, without
  # having to push a commit.
  workflow_dispatch:
    inputs:
      stages:
        description: >-
          Comma-separated stage names to run, or empty for all of them. Names come from
          `python3 scripts/check-stages.py --stages`. A stage left out is reported NOT RUN by
          the report job, never passed.
        required: false
        default: ""
      skip-unchanged:
        description: >-
          Let a stage whose inputs are byte-identical to a previous green run skip. It is
          reported CACHED, which is not a pass. Off by default because a digest over files
          cannot see git history, an installed toolchain, or a gitignored game image, and
          three of these stages depend on one of those.
        type: boolean
        required: false
        default: false

# One live run per ref: superseded runs on the same PR/branch are cancelled
# instead of running to completion. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Commit of vswarte/fromsoftware-rs the workspace is developed against.
  # The root crate uses `../fromsoftware-rs` path dependencies, so the
  # workspace cannot even be loaded by cargo without this sibling checkout.
  #
  # THIS PIN DECIDES WHICH GAME BUILDS THE DLLs SURVIVE, and it is not a
  # taste question. Every `T::instance_ptr()` in this workspace -- 63 sites
  # across 17 crates, and the ONLY way `er-death-persist` and
  # `mushroom-man-runtime` reach the game at all -- resolves through
  # upstream's own `crates/eldenring/src/rva/` bundle, selected by the
  # running image's PE version. `er-game-base`'s 1.17 gate is not on that
  # path and cannot cover it. Upstream's `rva::get()` ends in
  # `unwrap_or_else(|e| panic!("{e}"))`, so an unrecognised build is a PANIC
  # inside a game-loaded cdylib on the first singleton access, not a refusal.
  #
  # The previous pin, `9028518` ("Bump to 0.14.0"), predates the 1.17
  # bundle by two commits: at that revision `ERGameVersion::from_lang_version`
  # knows only `2.6.2.0` and `2.6.2.1`, and the installed game has been
  # `2.7.0.0` since 2026-08-27. The local sibling checkouts were already
  # past it, so local builds worked and only a CI-built artifact carried the
  # panic -- the split where the released DLL differs from the tested one.
  #
  # `1027d24` is the local sibling checkout's own revision. It adds
  # `rva/rva_ww_270.rs` (`4284a05`) and fixes an ambiguous `cs_system_step`
  # pattern that picked a different global on 2.7.0.0 (`1027d24`), while
  # KEEPING `2.6.2.0`/`2.6.2.1`. Do not advance this to upstream `main`
  # without re-verifying: `acb2a19` DELETES `rva_ww_270.rs` and rewrites
  # `rva_ww.rs`/`rva_jp.rs` as 1.17-only, dropping 1.16.2 support entirely.
  FROMSOFTWARE_RS_REV: 16d266146bcc7e896ac0d9a2c020e0d4c07baf52
  # WHICH REMOTE THE PIN ABOVE ACTUALLY EXISTS ON. This step used to clone
  # vswarte/fromsoftware-rs unconditionally, and from 2026-08-30 18:31 that made
  # this whole workflow dead: `1027d24` and its parent `4284a05` (the ones that
  # add the Elden Ring 2.7.0.0 / patch 1.17 RVA bundle) exist ONLY on the fork.
  # Verified against both remotes -- upstream advertises 325 refs and neither sha
  # is reachable from any of them. So `git checkout` died with `fatal: unable to
  # read tree`, at step 2 of ~15, and every Rust check below it reported NOTHING:
  # not pass, not fail. That blind window is exactly when two commits reached
  # origin that do not compile (15b32ab0, 11af0c60).
  #
  # Point this back at https://github.com/vswarte/fromsoftware-rs.git the moment
  # FROMSOFTWARE_RS_REV names a commit that is merged upstream. It is a clone URL
  # for a read-only checkout and nothing else; the rev pin above still decides
  # which game builds the DLLs survive, and it is unchanged.
  FROMSOFTWARE_RS_REMOTE: https://github.com/chozandrias76/fromsoftware-rs.git
  # Commit of eqtylab/cupcake the policy checker is built from. Also keys the
  # cache of the built binary -- bumping the rev invalidates the cache.
  CUPCAKE_REV: 27b94b8
  # cargo-xwin release to install. Pinned because it also keys the cache of the
  # Windows CRT/SDK that cargo-xwin downloads (defaults such as the bundled
  # xwin manifest version only move when this version moves).
  CARGO_XWIN_VERSION: 0.23.0
  # ShellCheck release to install, and it is a PIN rather than a preference:
  # `shellcheck` findings are version-dependent, so an unpinned linter is a gate
  # whose verdict drifts with whatever the runner image happens to ship. Measured
  # on run 33468994945: ubuntu-latest's apt ships 0.9.0, the developer tree runs
  # 0.11.0, and three of the 25 shellcheck steps were red in CI and clean locally
  # -- scripts/run-product-continue-direct-probe.sh, scripts/check-git-hooks-installed.sh
  # and scripts/test-er-stale-run-sentinel-e2e.sh. Every finding was SC2317
  # ("command appears to be unreachable") pointed at the body of a function that is
  # reached through a `trap`, plus one SC2015 note; 0.9.0's SC2317 does not model
  # trap-invoked reachability, later releases do. So the disagreement was the
  # linter's, not the scripts', and the fix is to run the same linter in both
  # places rather than to sprinkle `# shellcheck disable=` at an old version's
  # false positives. Bump this when the developer tree bumps.
  SHELLCHECK_VERSION: v0.11.0

  # The OPA build the policy suite is linted and tested against, pinned for the same reason
  # shellcheck is: `opa test` and `opa build -t wasm` are what decide whether a cupcake guard
  # fires, and a silently-moving `latest` decides that differently from the developer tree.
  # This is the version installed locally (`opa version` -> 1.16.1).
  OPA_VERSION: v1.16.1

jobs:
  # WHICH LINUX RUNNER `check` LANDS ON, decided per run instead of hard-coded.
  #
  # The org has one self-hosted runner, `Zerk`, on a laptop -- labels
  # `self-hosted, Linux, X64, local-linux, banon-laptop, zerk`. A laptop is not a service: it is
  # asleep, rebooting, or simply shut most of the time, and a job pinned to a runner that is not
  # there does not fail, it QUEUES -- silently, until someone notices the PR has no verdict. So the
  # choice is made from a liveness signal, and the answer when the signal is anything other than
  # "fresh" is `ubuntu-latest`.
  #
  # THIS JOB DELIBERATELY RUNS ON `ubuntu-latest` ITSELF. It is the thing that decides whether the
  # local runner is usable, so it cannot be scheduled on the local runner without being able to
  # deadlock on its own question.
  #
  # WHAT IT WILL ACTUALLY DO TODAY: fall back, every time. Measured 2026-09-03, three independent
  # reasons, none of them fixable from inside this file:
  #   1. `er-mods-rs` is a PUBLIC repo, and `Zerk` sits in runner group `Default`, which reports
  #      `"allows_public_repositories": false`. The only group with that flag true,
  #      `windows-defender`, has zero runners. Nothing schedules until Zerk moves to a group that
  #      admits public repos -- which is a SECURITY decision, not a config chore: a self-hosted
  #      runner on a public repo means a fork's pull request executes attacker-authored code on
  #      that laptop.
  #   2. `vars.BANON_ZERK_HEARTBEAT_EPOCH` has `"visibility": "private"`, so it evaluates to the
  #      empty string in a public repo no matter how fresh the real heartbeat is.
  #   3. The org's shared selector lives in the PRIVATE `Banon-Labs/.github`; a public caller
  #      cannot reuse a private callee, which is why the ~20 lines below are inlined rather than
  #      `uses:`-ed.
  #
  # It is wired now anyway because all three are toggles elsewhere: the day any of them changes,
  # this file already routes correctly with no edit, and until then it costs one ~5-second job.
  choose-runner:
    runs-on: ubuntu-latest
    outputs:
      runs_on_json: ${{ steps.pick.outputs.runs_on_json }}
      reason: ${{ steps.pick.outputs.reason }}
    steps:
      - id: pick
        env:
          # Read through env rather than interpolated into the script: a variable's value is
          # attacker-influenced in the general case, and `${{ }}` inside `run:` is textual
          # substitution into the shell -- the standard script-injection shape.
          HEARTBEAT_EPOCH: ${{ vars.BANON_ZERK_HEARTBEAT_EPOCH }}
        run: |
          set -euo pipefail
          # The org-standard label array, proven in production: Banon-Labs/linux-x86-debug run
          # 33699908675 landed four jobs on Zerk reporting exactly these labels. `local-linux` is
          # deliberately NOT among them -- it is a real label on Zerk, but there is also a runner
          # GROUP of that name holding zero runners, and the two are unrelated. The neighbouring
          # `krek` repo pinned `[self-hosted, linux, x64, local-linux]` and every one of its runs
          # was cancelled without ever being assigned a runner.
          local_json='["self-hosted","Linux","X64","banon-laptop"]'
          fallback_json='["ubuntu-latest"]'
          # How stale a heartbeat may be and still mean "awake". 180s is the org's existing window.
          freshness_window=180
          now=$(date +%s)

          if [ -z "${HEARTBEAT_EPOCH:-}" ]; then
            # Absent is NOT "stale by a lot" -- it is "the question was not answered", which today
            # is the private-variable case above. Same action, different reason, and the reason is
            # what someone reading a run needs.
            echo "runs_on_json=$fallback_json" >> "$GITHUB_OUTPUT"
            echo "reason=no heartbeat variable readable from this repo (private var in a public repo?) -- using ubuntu-latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$HEARTBEAT_EPOCH" in
            ''|*[!0-9]*)
              echo "runs_on_json=$fallback_json" >> "$GITHUB_OUTPUT"
              echo "reason=heartbeat is not an integer epoch -- using ubuntu-latest" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          age=$(( now - HEARTBEAT_EPOCH ))
          # A heartbeat from the FUTURE is a broken clock somewhere, not a live runner. Treating a
          # negative age as "very fresh" would pin every job to a laptop on the strength of a bug.
          if [ "$age" -lt 0 ] || [ "$age" -gt "$freshness_window" ]; then
            echo "runs_on_json=$fallback_json" >> "$GITHUB_OUTPUT"
            echo "reason=heartbeat ${age}s old (window ${freshness_window}s) -- using ubuntu-latest" >> "$GITHUB_OUTPUT"
          else
            echo "runs_on_json=$local_json" >> "$GITHUB_OUTPUT"
            echo "reason=heartbeat ${age}s old -- using the self-hosted runner" >> "$GITHUB_OUTPUT"
          fi

      - run: echo "runner choice -- ${{ steps.pick.outputs.reason }}"

  # WHICH STAGES EXIST, ASKED RATHER THAN TYPED.
  #
  # The matrix below is generated here instead of being written into this file, and that is the
  # whole reason this job exists. `.github/workflows/check.yml` used to name nine gates by hand
  # while scripts/check.sh ran 224, and nothing said so, because a hand-written list drifts
  # silently the moment somebody adds a gate. The same disease would come straight back in a new
  # shape if the eleven stage names were typed into a `matrix.stage` literal here.
  #
  # `scripts/check-stages.py --check` -- one of the steps of the suite itself -- refuses a check.sh
  # step that belongs to no stage or to two, so the list this job emits provably covers every one
  # of the 283 steps.
  plan:
    runs-on: ubuntu-latest
    outputs:
      stages: ${{ steps.plan.outputs.stages }}
      selected: ${{ steps.plan.outputs.selected }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        env:
          # Through env, not `${{ }}` inside `run:` -- a workflow input is attacker-influenced in
          # the general case and interpolation into a shell is the standard injection shape.
          REQUESTED: ${{ inputs.stages }}
        run: |
          set -euo pipefail
          all=$(python3 scripts/check-stages.py --matrix)
          echo "stages=$all" >> "$GITHUB_OUTPUT"
          if [ -z "${REQUESTED:-}" ]; then
            echo "selected=$all" >> "$GITHUB_OUTPUT"
          else
            # Intersect with the real list, so a typo cannot invent a job that then fails on a
            # missing stage; and keep the JSON shape the matrix needs.
            selected=$(python3 - "$REQUESTED" <<'PY'
          import json, subprocess, sys
          want = [s.strip() for s in sys.argv[1].split(",") if s.strip()]
          have = json.loads(subprocess.run(
              ["python3", "scripts/check-stages.py", "--matrix"],
              capture_output=True, text=True, check=True, timeout=30).stdout)
          missing = [w for w in want if w not in have]
          if missing:
              raise SystemExit(f"no such stage(s): {missing}; have {have}")
          print(json.dumps([h for h in have if h in want]))
          PY
            )
            echo "selected=$selected" >> "$GITHUB_OUTPUT"
          fi
      - run: |
          {
            echo '## Stages'
            echo
            echo '```'
            python3 scripts/check-stages.py --counts
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # DOES THE COMMITTED STATE COMPILE? Kept as its own job, ahead of and beside everything else,
  # for the reason it was introduced: it is the most basic claim any gate makes, and on 2026-08-31
  # it was false on the shared branch for hours while a dozen agents built on top of it. Stages
  # made it MORE valuable, not less -- it is now a job that can go red on its own run-page row
  # while eleven other jobs are still running, which is exactly the "know specific things faster"
  # this split is for.
  #
  # --workspace IS THE LOAD-BEARING FLAG. The workspace sets
  # `default-members = ["crates/er-quickload"]`, so a bare `cargo xwin check` selects that one
  # package and exits 0 in a fraction of a second having compiled nothing else, which reads exactly
  # like a successful incremental build. Both commits that broke the branch landed a CONSUMER
  # without its PRODUCER outside er-quickload's closure, so the bare form had nothing to say.
  #
  # --all-targets so `#[cfg(test)]` modules, benches and examples compile too; measured at 100 s
  # with it and 105 s without, so it costs nothing. --keep-going so one broken crate does not hide
  # the state of the rest.
  compiles:
    needs: choose-runner
    runs-on: ${{ fromJSON(needs.choose-runner.outputs.runs_on_json) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check out fromsoftware-rs as sibling
        run: |
          git clone "$FROMSOFTWARE_RS_REMOTE" "$GITHUB_WORKSPACE/../fromsoftware-rs"
          git -C "$GITHUB_WORKSPACE/../fromsoftware-rs" checkout "$FROMSOFTWARE_RS_REV"
      - name: Check out MinHook vendor source
        run: git clone --depth 1 --branch v1.3.4 https://github.com/TsudaKageyu/minhook.git vendor/minhook
      - name: Install Rust and the cross-compile system libraries
        run: |
          sudo apt-get install -y --no-install-recommends clang lld llvm wine \
              libwayland-dev libasound2-dev libudev-dev \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld llvm wine \
              libwayland-dev libasound2-dev libudev-dev; }
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup target add x86_64-pc-windows-msvc
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin@${{ env.CARGO_XWIN_VERSION }}
      - name: Cache xwin Windows CRT/SDK
        uses: actions/cache@v5
        with:
          path: ~/.cache/cargo-xwin
          key: xwin-sdk-${{ runner.os }}-cargo-xwin-${{ env.CARGO_XWIN_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo xwin check --workspace --all-targets --keep-going --target x86_64-pc-windows-msvc

  # ONE JOB PER STAGE. This is the visible half of the user's request: "I would like to see them as
  # discrete steps in github". A failure now lands on a row named for what broke -- `lint`,
  # `policy`, `addresses` -- instead of inside a single 30-minute step called "check".
  #
  # fail-fast: false, because the whole point of scripts/check.sh accumulating rather than
  # exiting is that a gate that never executed is indistinguishable from a gate that passed.
  # Cancelling nine stages because a tenth went red would re-create that defect one level up.
  #
  # max-parallel: 4 is the same number as ER_CHECK_JOBS' default in scripts/check.sh, because the
  # user asked for one default used in both places. Here it is not about cores -- each job gets its
  # own runner -- but about the caches: seven of the eleven stages restore the ~1 GB xwin CRT/SDK
  # and a rust-cache, and eleven simultaneous cold jobs would pull them eleven times. Raise it here
  # and in scripts/check.sh together; they are one edit each.
  stage:
    needs: [choose-runner, plan]
    runs-on: ${{ fromJSON(needs.choose-runner.outputs.runs_on_json) }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        stage: ${{ fromJSON(needs.plan.outputs.selected) }}
    name: stage / ${{ matrix.stage }}
    steps:
      # fetch-depth: 0, NOT the default 1. Two gates need real history: er-dll-closure.py
      # --selftest calls `git merge-base origin/main HEAD`, which fails outright on a shallow
      # clone, and check-no-local-main-commits.sh exits 2 without refs/remotes/origin/main.
      # This repo's whole history is 53 MB over 1812 commits, so full depth costs seconds.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # WHICH TOOLS THIS STAGE NEEDS, DERIVED. Not a map of stage to tools written into this file:
      # that is the hand-written list this whole change exists to abolish, and it would go stale
      # the first time a gate learned a new dependency. scripts/check-stages.py reads the stage's
      # own steps AND the source of the gate scripts they invoke -- which is how it knows that
      # `test-cupcake-policies.py`, a python3 step, needs the cupcake binary.
      - id: tools
        run: python3 scripts/check-stages.py --tools "${{ matrix.stage }}" >> "$GITHUB_OUTPUT"

      # check.sh REFUSES without MinHook, in every stage, so this is unconditional.
      - name: Check out MinHook vendor source
        run: git clone --depth 1 --branch v1.3.4 https://github.com/TsudaKageyu/minhook.git vendor/minhook

      - name: Check out fromsoftware-rs as sibling
        if: steps.tools.outputs.cargo == '1'
        run: |
          git clone "$FROMSOFTWARE_RS_REMOTE" "$GITHUB_WORKSPACE/../fromsoftware-rs"
          git -C "$GITHUB_WORKSPACE/../fromsoftware-rs" checkout "$FROMSOFTWARE_RS_REV"

      # THE THREE `lib*-dev` PACKAGES ARE THE er-shader-viewer GATE: `cargo check -p
      # er-shader-viewer` is a host-native Bevy 0.19 GUI and dies in wayland-sys's build script
      # without them. The set is measured, not guessed -- `cargo tree -e normal,build --invert
      # pkg-config` shows exactly three crates build-depend on pkg-config (wayland-sys, alsa-sys,
      # libudev-sys) and a check with pkg-config blinded fails in those three and no others.
      - name: Install Rust and the cross-compile system libraries
        if: steps.tools.outputs.cargo == '1'
        run: |
          sudo apt-get install -y --no-install-recommends clang lld llvm wine \
              libwayland-dev libasound2-dev libudev-dev \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld llvm wine \
              libwayland-dev libasound2-dev libudev-dev; }
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup target add x86_64-pc-windows-msvc

      # PINNED shellcheck, replacing whatever the runner image ships. Measured on run 33468994945:
      # ubuntu-latest's apt has 0.9.0, the developer tree runs 0.11.0, and three of the shellcheck
      # steps were red here and clean locally -- every finding an SC2317 false positive about
      # trap-invoked functions that later releases model correctly. An unpinned linter is a gate
      # whose verdict drifts with the runner image.
      - name: Install shellcheck (pinned)
        if: steps.tools.outputs.shellcheck == '1'
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | grep -qx "version: ${SHELLCHECK_VERSION#v}"

      - uses: taiki-e/install-action@v2
        if: steps.tools.outputs.xwin == '1'
        with:
          tool: cargo-xwin@${{ env.CARGO_XWIN_VERSION }}

      # On first use cargo-xwin downloads and unpacks the MSVC CRT and Windows SDK into
      # ~/.cache/cargo-xwin. That download comes from Microsoft's CDN and its duration is wildly
      # variable -- 40 s on a good run and 12 m 44 s on a throttled one (run 28757404582) -- so it
      # is restored from the Actions cache instead. The content is fully determined by the pinned
      # cargo-xwin version, so an exact-key hit is expected every run.
      - name: Cache xwin Windows CRT/SDK
        if: steps.tools.outputs.xwin == '1'
        uses: actions/cache@v5
        with:
          path: ~/.cache/cargo-xwin
          key: xwin-sdk-${{ runner.os }}-cargo-xwin-${{ env.CARGO_XWIN_VERSION }}

      # Pinned, from the release asset, and checked. `latest` broke run 34313440919 with a
      # connection reset after the redirector had already written an 86-byte error page over the
      # binary; without `-f` that page becomes `opa` and every policy gate then fails to parse.
      # `opa test` also decides whether a cupcake guard fires, so CI must run the developer tree's
      # version rather than whatever moved this week.
      - name: Install OPA (pinned)
        if: steps.tools.outputs.opa == '1'
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/opa \
            "https://github.com/open-policy-agent/opa/releases/download/${OPA_VERSION}/opa_linux_amd64_static"
          sudo install -m 0755 /tmp/opa /usr/local/bin/opa
          opa version | grep -qx "Version: ${OPA_VERSION#v}"

      # Cupcake has no prebuilt release at the pinned rev, so the built binary is cached; the
      # ~4.5 min source build then only runs when CUPCAKE_REV moves.
      - name: Cache Cupcake binary
        if: steps.tools.outputs.cupcake == '1'
        id: cache-cupcake
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cupcake
          key: cupcake-${{ runner.os }}-${{ env.CUPCAKE_REV }}

      - name: Install Cupcake policy checker
        if: steps.tools.outputs.cupcake == '1' && steps.cache-cupcake.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/eqtylab/cupcake.git --rev "$CUPCAKE_REV" cupcake-cli --locked

      # uv provisions capstone. There is no system pip here on purpose (AGENTS.md), and three gates
      # re-exec themselves through `uv run --with capstone`. Measured with uv off PATH they do not
      # print a skip -- they raise FileNotFoundError out of os.execvp before their first assertion,
      # which reads like a real failure -- so the ledger marks uv `!`-fatal for them.
      - name: Install uv
        if: steps.tools.outputs.uv == '1'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        if: steps.tools.outputs.cargo == '1'
        with:
          # Per stage, so the two cargo stages do not overwrite each other's entry with a
          # differently-warmed target directory.
          key: ${{ matrix.stage }}

      # HAS THIS EXACT STAGE ALREADY PASSED ON THESE EXACT INPUTS? Off unless someone asks for it
      # (workflow_dispatch's skip-unchanged), because a digest over files cannot see git history,
      # an installed toolchain or a gitignored game image, and `suite`, `cargo-build` and
      # `addresses` each depend on one of those. When it IS on, a hit reports CACHED, which the
      # report job counts separately from `passed` and says out loud.
      - id: stage-digest
        if: inputs.skip-unchanged
        run: echo "digest=$(python3 scripts/check-stages.py --inputs '${{ matrix.stage }}')" >> "$GITHUB_OUTPUT"

      - name: Restore this stage's green marker
        id: stage-cache
        if: inputs.skip-unchanged
        uses: actions/cache/restore@v5
        with:
          path: stage-results
          key: stage-green-${{ runner.os }}-${{ matrix.stage }}-${{ steps.stage-digest.outputs.digest }}

      - name: THE STAGE
        id: run
        if: steps.stage-cache.outputs.cache-hit != 'true'
        # ER_CHECK_RESULT_DIR is where check.sh writes the machine-readable copy of its per-step
        # table, which the report job joins back into one verdict over the whole suite.
        #
        # `stage-results`, with no leading dot, and that is load-bearing rather than cosmetic.
        # It was a dot-prefixed directory until running this workflow under `act` caught the cost:
        # `actions/upload-artifact@v4` globbed it, found nothing, and reported that as a yellow
        # `::warning::` on a step that still went GREEN -- so every stage would have uploaded an
        # empty artifact and the report job would have called all 283 steps NO REPORT, with no red
        # step anywhere to say why. An isolated probe pinned the cause to the dot and nothing else:
        # in one job, `dotless-results/*.tsv` uploaded and `.dot-results/*.tsv` did not, same
        # directory, same step, same relative form. `@actions/glob` will not match a path segment
        # beginning with a dot.
        #
        # `stage-results/` is in .gitignore, so a local run of the same command leaves no untracked
        # file behind for scripts/check-gate-config-guard.sh to notice.
        run: |
          mkdir -p "$GITHUB_WORKSPACE/stage-results"
          ER_CHECK_RESULT_DIR="$GITHUB_WORKSPACE/stage-results" \
            bash scripts/check.sh --stage "${{ matrix.stage }}"

      # A cache HIT means this stage did not execute, and every one of its steps still owes the
      # report a state. CACHED is that state, and it is not `passed`.
      - name: Record that this stage was skipped, not passed
        if: steps.stage-cache.outputs.cache-hit == 'true'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/stage-results"
          python3 scripts/check-stages.py --result-stub "${{ matrix.stage }}" --state CACHED \
            --reason "inputs unchanged since a green run (${{ steps.stage-digest.outputs.digest }})" \
            > "$GITHUB_WORKSPACE/stage-results/${{ matrix.stage }}.tsv"

      # Written only on success, so a marker can never mean "this failed quickly last time".
      - name: Save this stage's green marker
        if: inputs.skip-unchanged && success() && steps.stage-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: stage-results
          key: stage-green-${{ runner.os }}-${{ matrix.stage }}-${{ steps.stage-digest.outputs.digest }}

      # What the stage actually wrote, listed before it is uploaded. This exists because the
      # upload action's failure mode here is a yellow `::warning::` on a green step: it says "No
      # files were found" and the job still succeeds, so a stage that produced nothing looks
      # identical to one that produced its table. One `ls` makes the difference visible in the log.
      - name: What this stage wrote
        if: always()
        run: ls -l "$GITHUB_WORKSPACE/stage-results"

      # if: always() -- a red stage's per-step table is the most interesting one there is, and the
      # report job cannot tell "this stage failed" from "this stage never started" without it.
      - name: Upload this stage's per-step result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-result-${{ matrix.stage }}
          path: stage-results/*.tsv
          if-no-files-found: warn
          retention-days: 7

      - name: What this runner could not check
        if: always()
        run: |
          {
            echo "## Stage \`${{ matrix.stage }}\`"
            echo
            echo 'Gates this runner cannot execute, derived from `docs/ci-gate-portability.tsv`'
            echo '(measured, not guessed) rather than from a list in this workflow.'
            echo
            echo '```'
            python3 scripts/ci-gate-portability.py --probe
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ELEVEN GREEN JOBS ARE NOT A GREEN SUITE.
  #
  # Splitting the suite splits its verdict, and check.sh's whole discipline is that a step with no
  # verdict must never be read as a passing one. A stage that was cancelled, crashed before its
  # first gate, or never got a runner leaves its steps with nothing said about them -- and on a run
  # page that looks like a grey square next to ten green ticks, which nobody reads as red.
  #
  # So the stages are joined back together, by the same program scripts/check.sh runs after its own
  # fan-out, over the same files. A step whose stage produced no result file is NO REPORT, and
  # NO REPORT is red.
  report:
    needs: [plan, stage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: stage-result-*
          merge-multiple: true
          path: stage-results
      - name: Join every stage into one verdict
        run: |
          set -euo pipefail
          {
            echo '## Combined verdict'
            echo
            echo '```'
            python3 scripts/check-stage-report.py stage-results --quiet 2>&1 | tee /tmp/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          python3 scripts/check-stage-report.py stage-results --quiet
