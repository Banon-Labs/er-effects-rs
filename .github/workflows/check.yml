name: check

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger to re-warm the main-scoped tool caches (cupcake, xwin
  # CRT/SDK, rust-cache) if GitHub evicts them after an idle week, without
  # having to push a commit.
  workflow_dispatch:

# One live run per ref: superseded runs on the same PR/branch are cancelled
# instead of running to completion. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Commit of vswarte/fromsoftware-rs the workspace is developed against.
  # The root crate uses `../fromsoftware-rs` path dependencies, so the
  # workspace cannot even be loaded by cargo without this sibling checkout.
  #
  # THIS PIN DECIDES WHICH GAME BUILDS THE DLLs SURVIVE, and it is not a
  # taste question. Every `T::instance_ptr()` in this workspace -- 63 sites
  # across 17 crates, and the ONLY way `er-death-persist` and
  # `mushroom-man-runtime` reach the game at all -- resolves through
  # upstream's own `crates/eldenring/src/rva/` bundle, selected by the
  # running image's PE version. `er-game-base`'s 1.17 gate is not on that
  # path and cannot cover it. Upstream's `rva::get()` ends in
  # `unwrap_or_else(|e| panic!("{e}"))`, so an unrecognised build is a PANIC
  # inside a game-loaded cdylib on the first singleton access, not a refusal.
  #
  # The previous pin, `9028518` ("Bump to 0.14.0"), predates the 1.17
  # bundle by two commits: at that revision `ERGameVersion::from_lang_version`
  # knows only `2.6.2.0` and `2.6.2.1`, and the installed game has been
  # `2.7.0.0` since 2026-08-27. The local sibling checkouts were already
  # past it, so local builds worked and only a CI-built artifact carried the
  # panic -- the split where the released DLL differs from the tested one.
  #
  # `1027d24` is the local sibling checkout's own revision. It adds
  # `rva/rva_ww_270.rs` (`4284a05`) and fixes an ambiguous `cs_system_step`
  # pattern that picked a different global on 2.7.0.0 (`1027d24`), while
  # KEEPING `2.6.2.0`/`2.6.2.1`. Do not advance this to upstream `main`
  # without re-verifying: `acb2a19` DELETES `rva_ww_270.rs` and rewrites
  # `rva_ww.rs`/`rva_jp.rs` as 1.17-only, dropping 1.16.2 support entirely.
  FROMSOFTWARE_RS_REV: 16d266146bcc7e896ac0d9a2c020e0d4c07baf52
  # WHICH REMOTE THE PIN ABOVE ACTUALLY EXISTS ON. This step used to clone
  # vswarte/fromsoftware-rs unconditionally, and from 2026-08-30 18:31 that made
  # this whole workflow dead: `1027d24` and its parent `4284a05` (the ones that
  # add the Elden Ring 2.7.0.0 / patch 1.17 RVA bundle) exist ONLY on the fork.
  # Verified against both remotes -- upstream advertises 325 refs and neither sha
  # is reachable from any of them. So `git checkout` died with `fatal: unable to
  # read tree`, at step 2 of ~15, and every Rust check below it reported NOTHING:
  # not pass, not fail. That blind window is exactly when two commits reached
  # origin that do not compile (15b32ab0, 11af0c60).
  #
  # Point this back at https://github.com/vswarte/fromsoftware-rs.git the moment
  # FROMSOFTWARE_RS_REV names a commit that is merged upstream. It is a clone URL
  # for a read-only checkout and nothing else; the rev pin above still decides
  # which game builds the DLLs survive, and it is unchanged.
  FROMSOFTWARE_RS_REMOTE: https://github.com/chozandrias76/fromsoftware-rs.git
  # Commit of eqtylab/cupcake the policy checker is built from. Also keys the
  # cache of the built binary -- bumping the rev invalidates the cache.
  CUPCAKE_REV: 27b94b8
  # cargo-xwin release to install. Pinned because it also keys the cache of the
  # Windows CRT/SDK that cargo-xwin downloads (defaults such as the bundled
  # xwin manifest version only move when this version moves).
  CARGO_XWIN_VERSION: 0.23.0
  # ShellCheck release to install, and it is a PIN rather than a preference:
  # `shellcheck` findings are version-dependent, so an unpinned linter is a gate
  # whose verdict drifts with whatever the runner image happens to ship. Measured
  # on run 33468994945: ubuntu-latest's apt ships 0.9.0, the developer tree runs
  # 0.11.0, and three of the 25 shellcheck steps were red in CI and clean locally
  # -- scripts/run-product-continue-direct-probe.sh, scripts/check-git-hooks-installed.sh
  # and scripts/test-er-stale-run-sentinel-e2e.sh. Every finding was SC2317
  # ("command appears to be unreachable") pointed at the body of a function that is
  # reached through a `trap`, plus one SC2015 note; 0.9.0's SC2317 does not model
  # trap-invoked reachability, later releases do. So the disagreement was the
  # linter's, not the scripts', and the fix is to run the same linter in both
  # places rather than to sprinkle `# shellcheck disable=` at an old version's
  # false positives. Bump this when the developer tree bumps.
  SHELLCHECK_VERSION: v0.11.0

jobs:
  # WHICH LINUX RUNNER `check` LANDS ON, decided per run instead of hard-coded.
  #
  # The org has one self-hosted runner, `Zerk`, on a laptop -- labels
  # `self-hosted, Linux, X64, local-linux, banon-laptop, zerk`. A laptop is not a service: it is
  # asleep, rebooting, or simply shut most of the time, and a job pinned to a runner that is not
  # there does not fail, it QUEUES -- silently, until someone notices the PR has no verdict. So the
  # choice is made from a liveness signal, and the answer when the signal is anything other than
  # "fresh" is `ubuntu-latest`.
  #
  # THIS JOB DELIBERATELY RUNS ON `ubuntu-latest` ITSELF. It is the thing that decides whether the
  # local runner is usable, so it cannot be scheduled on the local runner without being able to
  # deadlock on its own question.
  #
  # WHAT IT WILL ACTUALLY DO TODAY: fall back, every time. Measured 2026-09-03, three independent
  # reasons, none of them fixable from inside this file:
  #   1. `er-mods-rs` is a PUBLIC repo, and `Zerk` sits in runner group `Default`, which reports
  #      `"allows_public_repositories": false`. The only group with that flag true,
  #      `windows-defender`, has zero runners. Nothing schedules until Zerk moves to a group that
  #      admits public repos -- which is a SECURITY decision, not a config chore: a self-hosted
  #      runner on a public repo means a fork's pull request executes attacker-authored code on
  #      that laptop.
  #   2. `vars.BANON_ZERK_HEARTBEAT_EPOCH` has `"visibility": "private"`, so it evaluates to the
  #      empty string in a public repo no matter how fresh the real heartbeat is.
  #   3. The org's shared selector lives in the PRIVATE `Banon-Labs/.github`; a public caller
  #      cannot reuse a private callee, which is why the ~20 lines below are inlined rather than
  #      `uses:`-ed.
  #
  # It is wired now anyway because all three are toggles elsewhere: the day any of them changes,
  # this file already routes correctly with no edit, and until then it costs one ~5-second job.
  choose-runner:
    runs-on: ubuntu-latest
    outputs:
      runs_on_json: ${{ steps.pick.outputs.runs_on_json }}
      reason: ${{ steps.pick.outputs.reason }}
    steps:
      - id: pick
        env:
          # Read through env rather than interpolated into the script: a variable's value is
          # attacker-influenced in the general case, and `${{ }}` inside `run:` is textual
          # substitution into the shell -- the standard script-injection shape.
          HEARTBEAT_EPOCH: ${{ vars.BANON_ZERK_HEARTBEAT_EPOCH }}
        run: |
          set -euo pipefail
          # The org-standard label array, proven in production: Banon-Labs/linux-x86-debug run
          # 33699908675 landed four jobs on Zerk reporting exactly these labels. `local-linux` is
          # deliberately NOT among them -- it is a real label on Zerk, but there is also a runner
          # GROUP of that name holding zero runners, and the two are unrelated. The neighbouring
          # `krek` repo pinned `[self-hosted, linux, x64, local-linux]` and every one of its runs
          # was cancelled without ever being assigned a runner.
          local_json='["self-hosted","Linux","X64","banon-laptop"]'
          fallback_json='["ubuntu-latest"]'
          # How stale a heartbeat may be and still mean "awake". 180s is the org's existing window.
          freshness_window=180
          now=$(date +%s)

          if [ -z "${HEARTBEAT_EPOCH:-}" ]; then
            # Absent is NOT "stale by a lot" -- it is "the question was not answered", which today
            # is the private-variable case above. Same action, different reason, and the reason is
            # what someone reading a run needs.
            echo "runs_on_json=$fallback_json" >> "$GITHUB_OUTPUT"
            echo "reason=no heartbeat variable readable from this repo (private var in a public repo?) -- using ubuntu-latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$HEARTBEAT_EPOCH" in
            ''|*[!0-9]*)
              echo "runs_on_json=$fallback_json" >> "$GITHUB_OUTPUT"
              echo "reason=heartbeat is not an integer epoch -- using ubuntu-latest" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          age=$(( now - HEARTBEAT_EPOCH ))
          # A heartbeat from the FUTURE is a broken clock somewhere, not a live runner. Treating a
          # negative age as "very fresh" would pin every job to a laptop on the strength of a bug.
          if [ "$age" -lt 0 ] || [ "$age" -gt "$freshness_window" ]; then
            echo "runs_on_json=$fallback_json" >> "$GITHUB_OUTPUT"
            echo "reason=heartbeat ${age}s old (window ${freshness_window}s) -- using ubuntu-latest" >> "$GITHUB_OUTPUT"
          else
            echo "runs_on_json=$local_json" >> "$GITHUB_OUTPUT"
            echo "reason=heartbeat ${age}s old -- using the self-hosted runner" >> "$GITHUB_OUTPUT"
          fi

      - run: echo "runner choice -- ${{ steps.pick.outputs.reason }}"

  check:
    needs: choose-runner
    runs-on: ${{ fromJSON(needs.choose-runner.outputs.runs_on_json) }}
    # NO `timeout-minutes` HERE, and that is enforced, not a preference: scripts/check-no-timeouts.py
    # rejects any YAML `timeout-minutes` above its 30-second cap, on the grounds that a wall-clock
    # bound is not a synchronisation primitive. The job's real bound is internal -- every gate is
    # itself time-bounded, and check.sh reports a killed step as INCONCLUSIVE rather than as a pass.
    steps:
      # fetch-depth: 0, NOT the default 1. Two gates need real history, not just the tip:
      # scripts/er-dll-closure.py --selftest calls `git merge-base origin/main HEAD`, which on a
      # shallow clone fails outright -- three of its --with/--without cases then report FAIL rather
      # than skip, because the error is raised before the validation they are testing --  and
      # scripts/check-no-local-main-commits.sh exits 2 without refs/remotes/origin/main to diff
      # against. Fetching a ref alone is not enough; the merge base has to exist. Measured: this
      # repo's whole history is 53 MB over 1812 commits, so full depth costs a few seconds.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check out fromsoftware-rs as sibling
        run: |
          git clone "$FROMSOFTWARE_RS_REMOTE" "$GITHUB_WORKSPACE/../fromsoftware-rs"
          git -C "$GITHUB_WORKSPACE/../fromsoftware-rs" checkout "$FROMSOFTWARE_RS_REV"

      - name: Check out MinHook vendor source
        run: git clone --depth 1 --branch v1.3.4 https://github.com/TsudaKageyu/minhook.git vendor/minhook

      - name: Install Rust (stable + windows target + wine)
        run: |
          # Runner apt lists are usually fresh enough to install without an
          # `apt-get update` (~20-60 s); fall back to updating only on a miss.
          #
          # THE THREE `lib*-dev` PACKAGES ARE THE er-shader-viewer GATE. check.sh ends with
          # `cargo check -p er-shader-viewer`, a host-native Bevy 0.19 GUI, and on 2026-09-01
          # that step was the one red gate in the first run that executed the whole suite: it
          # died in wayland-sys's build script with "Package wayland-client was not found in
          # the pkg-config search path".
          #
          # The set is MEASURED, not guessed from that one error. Two independent probes agree:
          # `cargo tree -p er-shader-viewer -e normal,build --invert pkg-config` shows the
          # `pkg-config` crate is a build-dependency of exactly three crates in the entire tree
          # -- wayland-sys (via winit/smithay), alsa-sys (via bevy_audio/rodio/cpal) and
          # libudev-sys (via bevy_gilrs) -- and a `cargo check --keep-going` with pkg-config
          # blinded (PKG_CONFIG_LIBDIR pointed at an empty directory) fails in those same three
          # build scripts and no others, probing `wayland-client`, `alsa` and `libudev`.
          #
          # Bevy's own docs/linux_dependencies.md additionally lists libx11-dev and
          # libxkbcommon-dev; both are deliberately NOT here. This gate is a `cargo check`, so
          # nothing is ever dlopen'd, and x11-dl / xkbcommon-dl / ash resolve their libraries at
          # RUN time -- the blinded probe proves they need nothing at build time. Adding them
          # would be padding for a gate that never opens a window.
          #
          # shellcheck is NOT installed from apt: see SHELLCHECK_VERSION above. apt ships 0.9.0,
          # whose SC2317 false-positives on trap handlers made three gates red here and clean on
          # the developer tree, so the pinned upstream release is fetched in the step below.
          sudo apt-get install -y --no-install-recommends clang lld llvm wine \
              libwayland-dev libasound2-dev libudev-dev \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld llvm wine \
              libwayland-dev libasound2-dev libudev-dev; }
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup target add x86_64-pc-windows-msvc

      # PINNED shellcheck, replacing the apt one. scripts/check.sh runs 25 shellcheck steps and
      # its `shellcheck()` wrapper SKIPS them when the tool is absent, so a runner image that
      # stopped shipping it would quietly cost 25 gates -- and one that ships a DIFFERENT version
      # costs correctness instead, which is worse because it is invisible. Both failure modes are
      # closed by fetching one known build. Upstream ships a static binary, so this is a curl and
      # a move, the same shape as the OPA step below; measured at a couple of seconds.
      - name: Install shellcheck (pinned)
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          # Fail loudly here rather than let 25 gates silently lint under the wrong version.
          shellcheck --version
          shellcheck --version | grep -qx "version: ${SHELLCHECK_VERSION#v}"

      # Prebuilt release binary; replaces a ~1 min `cargo install cargo-xwin`.
      - name: Install cargo-xwin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin@${{ env.CARGO_XWIN_VERSION }}

      # On first use cargo-xwin downloads + unpacks the MSVC CRT and Windows
      # SDK into ~/.cache/cargo-xwin. That download comes from Microsoft's CDN
      # and its duration is wildly variable -- observed 40 s on a good run and
      # 12 m 44 s on a throttled one (run 28757404582) -- so restore it from
      # the Actions cache instead of re-downloading every run. The content is
      # fully determined by the pinned cargo-xwin version, so an exact-key hit
      # is expected every run and the ~1 GB dir is only uploaded once per bump.
      - name: Cache xwin Windows CRT/SDK
        uses: actions/cache@v5
        with:
          path: ~/.cache/cargo-xwin
          key: xwin-sdk-${{ runner.os }}-cargo-xwin-${{ env.CARGO_XWIN_VERSION }}

      - name: Install OPA policy engine
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

      # Cupcake has no prebuilt releases at our pinned rev, so cache the binary
      # we build; the ~4.5 min source build then only runs when CUPCAKE_REV moves.
      - name: Cache Cupcake binary
        id: cache-cupcake
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cupcake
          key: cupcake-${{ runner.os }}-${{ env.CUPCAKE_REV }}

      - name: Install Cupcake policy checker
        if: steps.cache-cupcake.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/eqtylab/cupcake.git --rev "$CUPCAKE_REV" cupcake-cli --locked

      # uv provisions capstone. There is no system pip here on purpose (AGENTS.md), and three
      # gates re-exec themselves through `uv run --with capstone`: check-singleton-field-offsets.py
      # (both halves) and verify-prologue-masks-1170.py --selftest. Measured with uv off PATH, they
      # do not print a skip -- they raise FileNotFoundError out of os.execvp before their first
      # assertion, which reads like a real failure. The ledger marks uv `!`-fatal for them so a
      # runner without uv gets a loud SKIP instead; installing it means they actually run.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2

      # DOES THE COMMITTED STATE COMPILE? Deliberately the FIRST Rust step: it is the most basic
      # claim any gate below makes, and on 2026-08-31 it was false on the shared branch for hours
      # while a dozen agents built on top of it.
      #
      # --workspace IS THE LOAD-BEARING FLAG. The workspace sets
      # `default-members = ["crates/er-quickload"]`, so a bare `cargo xwin check`/`build` -- the
      # form the pre-push path used to end with -- selects that one package and exits 0 in a
      # fraction of a second having compiled nothing else, which reads exactly like a successful
      # incremental build. Both commits that broke the branch landed a CONSUMER without its
      # PRODUCER in crates outside er-quickload's dependency closure at that commit
      # (er-save-suppress; er-quickload's own reference to two crates not yet in the tree), so the
      # bare form had nothing to say about either.
      #
      # --all-targets so `#[cfg(test)]` modules, benches and examples compile too -- a lib-only
      # check reports OK over a test module naming a helper the commit does not carry. Measured on
      # a cold cache the same day: 100 s with it, 105 s without, so it costs nothing.
      #
      # --keep-going so one broken crate does not hide the state of the rest: without it the run
      # stops at the first failure and the report understates the damage.
      #
      # KEPT SEPARATE FROM check.sh BELOW, which asks the same question through
      # scripts/check-committed-compiles.sh -- in a temp worktree, and ~1400 lines in. This step
      # answers it in 100 s at the top, so a branch that does not compile says so immediately
      # instead of after the whole suite.
      - name: Does the committed state compile (whole workspace, windows target)
        run: cargo xwin check --workspace --all-targets --keep-going --target x86_64-pc-windows-msvc

      # THE WHOLE SUITE, NOT A HAND-COPIED SUBSET OF IT.
      #
      # This step replaces nine hand-named gate steps. Those nine were the entire CI surface while
      # scripts/check.sh ran 224 -- so ~215 gates existed, passed locally, and were invisible here.
      # That gap was not an oversight anyone could have noticed: the step list was written by hand,
      # so it drifted silently every time a gate was added, and CI going green said only that nine
      # named things were fine. The same disease was found the same day inside check.sh itself,
      # whose shellcheck coverage is also a hand list and had silently dropped scripts/opa-query.sh.
      #
      # Running check.sh instead makes the CI set DERIVED: a gate appended to check.sh runs here
      # from the moment it lands, with nothing to remember to update. Coverage now goes:
      #
      #   226 steps -- 203 run here, 23 SKIPPED for inputs a runner cannot hold.
      #   Of the 226: 166 invoke a repo gate script and are classified in the ledger; 60 are
      #   toolchain steps (cargo/shellcheck/rustfmt/opa/cupcake) whose only dependency is the tool
      #   being installed, which check.sh resolves at run time rather than from a list.
      #   Of the 166 ledgered: 131 portable, 8 partial (run, and say which half they lost),
      #   27 blocked. The 23 skipped above are the blocked rows whose input is absent HERE --
      #   fewer than 27 because this workflow installs uv and clones minhook.
      #
      # WHAT IT CANNOT RUN, AND WHY THAT IS SAFE. Two inputs are impossible on a runner: the
      # de-Arxan'd game images (eldenring-deobf{,-1.17}.bin -- gitignored, ~100 MB, derived from
      # the user's install) and things derived from them. A gate whose input is absent is SKIPPED,
      # out loud, and check.sh's summary gives it its own state -- never `passed`. Before this
      # change that failure mode was live and silent: measured in a runner-equivalent checkout,
      # FOURTEEN gates printed a single line saying their input was absent and EXITED 0 -- so the
      # summary wrote `passed` beside a gate that had asserted nothing at all -- and three more
      # died with a raw FileNotFoundError out of os.execvp because uv was not there to fetch
      # capstone, which reads like a real failure rather than a missing tool. The classification is
      # docs/ci-gate-portability.tsv, measured rather than guessed, and enforced by
      # ci-gate-portability.py --check, which is itself one of the steps below -- so a new gate
      # cannot land without someone answering "does this run without the game image?".
      #
      # check.sh exits 0 with skips present, by design: a runner must not be permanently red for
      # not holding a 100 MB game asset. It never says "all steps ran" in that case, and the step
      # after this one puts the skip inventory in the run summary where it cannot rot unseen.
      #
      # NOT `set -e`. check.sh accumulates failures and prints a per-step table, so one red gate
      # does not erase the verdict of the ~200 behind it.
      - name: Run the whole gate suite (scripts/check.sh)
        run: bash scripts/check.sh

      # THE SKIP INVENTORY, ON THE RUN PAGE. `if: always()` because the interesting case is the run
      # that went red: "which gates had nothing to say here" is exactly the question a red run
      # provokes, and it must not require reading 224 lines of log to answer.
      - name: What this runner could not check
        if: always()
        run: |
          {
            echo '## Gates this runner cannot execute'
            echo
            echo 'Derived from `docs/ci-gate-portability.tsv` (measured, not guessed) --'
            echo 'not from a hand-written list in this workflow.'
            echo
            echo '```'
            python3 scripts/ci-gate-portability.py --probe
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
