[package]
name = "er-save-suppress"
version = "0.1.0"
edition = "2024"
publish = false

# Save-write suppression CORE, shared by the standalone `er-save-disable-dll` and the
# product `er-effects-rs` cdylib. Plain rlib: it never ships as its own DLL -- exactly one
# host DLL links it per process, wires the log/publish sinks, and calls `install`.
#
# NEVER load `er_save_disable.dll` and `er_effects_rs.dll` together in one me3 profile:
# each DLL carries its own MinHook instance, so both would detour the same game prologues
# (`0x140e6fb50` / `0x140e6e430`) and corrupt each other's trampolines.
#
# Tier A `er-game-base` only (no `game-types`): suppression works off two byte-verified
# game RVAs plus fault-safe RAM reads, so it needs no typed game bindings and stays a lean
# cross-compile. Host builds (for the unit tests of the pure decision logic) compile the
# same crate with all hook code cfg'd out.
[dependencies]
er-game-base = { path = "../er-game-base" }

[target.'cfg(windows)'.dependencies]
er-hook = { path = "../er-hook" }

[lints]
workspace = true
