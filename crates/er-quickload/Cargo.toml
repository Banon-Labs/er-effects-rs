[package]
name = "er-quickload"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# `rlib` beside the DLL so a feature-selected subset of this crate can be linked into a smaller
# shell. `er-quickload` is a bespoke bundle: it began as "autoload my character at boot" and
# accumulated the quit rows, the save picker, the loading cover, the portrait and the tracing. The
# installer this repo is heading for hands a user the features they chose, which means one
# implementation compiled several ways -- not one fork per shell, which would put two copies of the
# row cloner and the hook union in one workspace.
crate-type = ["cdylib", "rlib"]

[features]
# The rows come off the default set. A plain build is the autoload, the save picker the autoload
# needs, the loading cover, the portraits and the menu trace -- the System>Quit tab keeps exactly
# the rows the game ships. `quit-rows` is still written, still compiled by check.sh, and still
# one word away: name it here, or pass --features quit-rows, and the three cloned rows and the
# switch behind them come back.
default = ["autoload", "save-picker", "loading-cover", "portrait", "menu-trace"]
# Reach a clean title and deserialise a slot: the own-stepper, the Continue driver, the fullread.
# The thing the crate is named after.
autoload = []
# The cloned System>Quit rows and the flows behind them.
quit-rows = []
# The in-game save-file browser the Load Character from File row opens.
save-picker = []
# The loading-screen cover and the title visuals.
loading-cover = []
# The character portraits on the loading screen and the Quit panel.
portrait = []
# Menu construction and native-result tracing. Diagnostics: no product surface depends on it.
menu-trace = []

[dependencies]
# Shared cross-platform telemetry counters used by host checks and the Windows DLL.
# The crash record's own format, read back. `crashlog/veh_exit_hooks.rs` decides whether the
# newest `er-crash-latest.txt` describes THIS run, and the field spellings it needs -- `fatal=`,
# `record_index=`, `utc=` -- belong to the crate that writes them. Depending on the writer for the
# parse keeps one owner of the format and puts the decision somewhere the host can test it.
er-crash-logging-core = { path = "../er-crash-logging-core" }
er-telemetry-core = { path = "../er-telemetry-core" }
er-title-flow = { path = "../er-title-flow" }

[target.'cfg(windows)'.dependencies]
eldenring = { path = "../../../fromsoftware-rs/crates/eldenring" }
# Shared MinHook FFI + hook union (compiles the vendored MinHook C once; this crate defines the
# `er_effects_union_register` export over `er_hook::register_union_hook`).
er-hook = { path = "../er-hook" }
# Native Scaleform hook mechanisms. Product policy/logging remains in this crate.
er-scaleform-hooks = { path = "../er-scaleform-hooks" }
# Shared low-level foundation (fault-safe RAM readers, game base/rva, stable
# singleton RVA table, logger core). Source of truth for primitives previously
# defined in experiments/mem.rs. game-types re-exports the typed game bindings.
er-game-base = { path = "../er-game-base", features = ["game-types"] }
# Diagnostic-only boot CPU/RIP sampler. The product starts it at the existing early attach point;
# the crate owns its opt-in policy, sampling mechanism, and NDJSON output.
er-boot-profiler = { path = "../er-boot-profiler" }
er-save-loader = { path = "../er-save-loader" }
# Host-runnable save-source/redirect planner. Process-wide hooks stay in this product crate until
# the later save-redirect owner slice.
er-save-redirect = { path = "../er-save-redirect" }
er-save-picker-core = { path = "../er-save-picker-core", default-features = false, features = ["boot-flow", "os-dialog"] }
# Customized System>Quit decision core. Hooked surfaces stay in this crate until S8.
er-quit-menu-core = { path = "../er-quit-menu-core" }
# Game-side build importer, shared with the standalone er-build-import shell. The System>Quit
# "Load Build from URL" row calls `request` on a press and `tick` from the FrameBegin task.
# NEVER load er_build_import_core.dll alongside this DLL in one me3 profile: each would drive its own
# copy of the runtime against the same character.
er-build-import-runtime = { path = "../er-build-import-runtime" }
# The importer's PURE half. Linked directly (not only through the runtime) because the System>Quit
# link field validates what the player typed with the same `validate_build_url` the host tests pin,
# rather than a second copy of the rule that could drift from it.
er-build-import-core = { path = "../er-build-import-core" }
# Save-write suppression core, shared with the standalone er-save-disable (save-game-flow
# WP1): swallow every SL save enqueue + rewrite the status poll from boot, plus the one-shot
# bypass token that makes the System->Quit "Save Game" row the ONLY path that really writes.
# NEVER load er_save_disable.dll alongside this DLL in one me3 profile (two MinHook instances
# would double-detour 0xe6fb50/0xe6e430).
er-save-suppress = { path = "../er-save-suppress" }
# In-memory texture-payload builder: portrait pixels -> uncompressed R8G8B8A8 DDS -> TPF003 blob,
# fed to the game's in-memory TPF factory to replace the now-loading background. Pure-Rust, std-only.
er-tpf = { path = "../er-tpf" }
# GFX (Scaleform SWF-variant) codec + content-addressed tag edits: derives the stripped
# 05_000_title movie at runtime from the game's own in-memory vanilla bytes instead of embedding
# the full asset (er-effects-rs-h7x). Pure-Rust, std-only.
er-gfx = { path = "../er-gfx" }
# ERPX portrait-dump container (encode side): single source of truth for the debug RGBA dump format
# portrait/debug proof tooling writes. Core-only (default-features off) so the DLL never pulls the host `png` dep.
erpx-rs = { path = "../erpx-rs", default-features = false }
# Backend-neutral loading-bar labels/font/raster primitives. Runtime adapters in this crate still own
# Elden Ring semaphores, D3D12 swapchains, and ME3/product integration.
er-loading-bar-core = { path = "../er-loading-bar-core" }
# Boot-cover screenshot background: discovery + WIC decode + the aspect-cover/vignette pixel passes.
# The product keeps only the once-per-process cache and the answer to "where do I look".
er-boot-background = { path = "../er-boot-background" }
# Loading-screen portrait + stats feature (path B capture pipeline + compositors + native
# overlay host), extracted in the portrait crate split. The product keeps bundling it;
# product state crosses the seam via `er_loading_portrait_core::install_host` in bootstrap.rs.
er-loading-portrait-core = { path = "../er-loading-portrait-core" }
# `CS::ProfileSummary` reading + writing (the live-record fingerprint, the summary pointer, the
# serialized-save reader that fills a record, the whole-table rebuild, and the picked-save
# re-read), extracted from four files of this crate. Product state crosses the seam via
# `er_profile_summary_core::host::install_host` in bootstrap.rs.
er-profile-summary-core = { path = "../er-profile-summary-core" }
# The release fade's D3D12 half: the cover's command objects plus the alpha-blended full-screen
# frame. This crate still decides when the fade runs, at what alpha, and what the frame contains.
er-cover-fade = { path = "../er-cover-fade" }
er-d3d12-compositor = { path = "../er-d3d12-compositor" }
fromsoftware-shared = { path = "../../../fromsoftware-rs/crates/shared" }
pelite = "0.10"
bitflags = "2"
# In-process x86-64 decoding (instruction lengths, prologue/pattern validation).
# Pure-Rust decoder used directly so the hand-rolled single-step/prologue logic in lib.rs
# can decode instead of hard-coding byte lengths. Lean feature set: decoder only, no
# formatters/encoder.
iced-x86 = { version = "1.21", default-features = false, features = [
  "std",
  "decoder",
] }
# Win32 process/window helpers and MinHook target resolution.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Performance",
  "Win32_System_Kernel",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Debug",
  # SystemTimeToTzSpecificLocalTime: the save picker's file rows show when each file was last
  # written, and a user-facing timestamp is local time. This applies the zone's DST rules for the
  # instant being rendered, so a save from the other side of a boundary keeps the wall-clock time it
  # was written at (comparing GetLocalTime to GetSystemTime would only give the offset for NOW).
  "Win32_System_Time",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_SystemServices",
  # Read HKCU\Software\Valve\Steam\SteamPath so the boot-background feature can find the Windows Steam
  # userdata (screenshots) -- the install dir is not an ancestor of a game in a separate library.
  "Win32_System_Registry",
  # OpenClipboard/GetClipboardData/GetClipboardSequenceNumber for the System>Quit build-url editor.
  # Ctrl+V inside the game's software keyboard does nothing, so this DLL puts the clipboard into the
  # field itself -- when it opens, and again whenever the clipboard changes while it is open.
  #
  # CORRECTED 2026-08-23: an earlier note here claimed the image references the clipboard APIs
  # nowhere. It does -- `FUN_1426760c0` really opens the clipboard and copies CF_UNICODETEXT into a
  # DLString. It is just not reachable from the keyboard: it sits in slot +0x100 of one vtable
  # (0x143296bb8, the only one in the image holding it) with no call site, among siblings that
  # measure text through GLOBAL_FD4FontManager, while the keyboard is a different object graph
  # entirely (SoftwareKeyboard::detail::SoftwareKeyboardManagerImpl over a Scaleform 02_990
  # MenuWindow fallback). The conclusion held; the reason given for it was wrong, and wrong reasons
  # get re-checked at the cost of a session.
  "Win32_System_DataExchange",
  # `ShellExecuteW` opens the generated build link in the player's browser. Under Proton that goes
  # through `winebrowser.exe` -> `xdg-open` -> the host default browser, measured to pass the URL
  # through complete and untruncated at 5043 characters -- the classic 2083-char
  # INTERNET_MAX_URL_LENGTH does not apply here, which matters because a share link is ~3 KB.
  "Win32_UI_Shell",
  "Win32_System_Ole",
  # Hidden dummy window for the D3D12 Present-overlay swapchain: CreateSwapChainForComposition is
  # "Not implemented" under vkd3d/Wine, so we need a real HWND via CreateSwapChainForHwnd, which pulls
  # in WNDCLASSW's GDI handle types.
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_UI_WindowsAndMessaging",
  # SendInput/KEYBDINPUT + AttachThreadInput/SetFocus for the self-driving System->Quit repro
  # harness: native ER reads keyboard via RawInput (not DInput, ignores posted WM_KEYDOWN), so the
  # autopilot forces the window foreground and injects real OS keystrokes (diagnostic path only).
  "Win32_UI_Input_KeyboardAndMouse",
  # comdlg32 (GetOpenFileNameW / GetSaveFileNameW / CommDlgExtendedError) for the OPT-IN OS file
  # picker: `er-quickload.toml os_native_save_picker = true` routes BOTH System -> Quit surfaces --
  # "Load Character from File" and the Save Game destination list -- to the OS dialog instead of the
  # in-game 05_010 browser. The reusable mechanism lives in er-save-picker-core::os_dialog; the product
  # entrypoints still live in startup_hooks/save_picker/save_picker_os_dialog.rs.
  "Win32_UI_Controls_Dialogs",
  # CreateEventW (fence-completion event for the D3D12 readback wait) is gated behind Win32_Security.
  "Win32_Security",
  # GetFileInformationByHandle: SAME-FILE identity (volume serial + file index) for the save
  # destination commit. Two spellings of one file -- `C:\users\steamuser\...` and
  # `Z:\...\pfx\drive_c\users\steamuser\...` under Wine -- must not read as two files, because
  # redirecting the loaded save onto itself makes the safety net restore a pre-save snapshot over
  # the save that just succeeded.
  "Win32_Storage_FileSystem",
  # D3D12 readback of the live profile-portrait offscreen render target, so the now-loading
  # forge can display the real rendered character head instead of the placeholder checker.
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Direct3D",
] }
# LINT PARITY (root `[workspace.lints]`): this crate is at ZERO clippy + rustc warnings on its
# shipping target (`cargo xwin clippy --release --target x86_64-pc-windows-msvc --all-targets`),
# so it opts into the denied `rust.warnings` + `clippy.all` groups with no per-lint escapes.
#
# Getting here cleared 542 measured violations plus the 1,046 `unused_imports` that this crate's
# 25 module-level `#![allow(unused_imports)]` blankets had been hiding. All 25 blankets are gone --
# the imports behind them were deleted, so the crate is clean on its own rather than by suppression.
#
# The 246 `dead_code` hits were NOT blanket-allowed either: 8 items were genuinely orphaned
# scaffolding and were deleted, and the rest carry a per-item `#[allow(dead_code)]` with a one-line
# reason, because this is a reverse-engineering codebase and most of that "dead" code is a decoded
# RVA, struct offset, or value vocabulary that is worth keeping whether or not anything reads it
# today. The only other escapes are four per-site `#[allow]`s: two `permissions_set_readonly_false`
# (the lint describes a UNIX behaviour this Windows-only DLL cannot reach) and two
# `too_many_arguments` on pass-throughs that mirror `er_loading_bar_core`'s own signatures.
[lints]
workspace = true

# Assembles every byte-checked prologue from NAMED instructions in `build.rs`, so a hand-typed
# byte can never disarm a hook. `code_asm` is the encoder side and is build-time only; the
# runtime dependency above stays decoder-only. See `build-support/prologue_build.rs`.
[build-dependencies]
iced-x86 = { version = "1.21", default-features = false, features = [
  "std",
  "code_asm",
] }
