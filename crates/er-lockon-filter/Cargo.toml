[package]
name = "er-lockon-filter"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "er_lockon_filter"
crate-type = ["cdylib"]

# Standalone ME3-loadable DLL that drops fellow invaders out of the lock-on candidate set
# while you are invading. It detours one function -- the lock-on system's point-owner
# resolver -- and has no dependency on the product DLL or its config surface.
[dependencies]
er-game-base = { path = "../er-game-base" }

# Assembles the detoured function's expected prologue from named `iced-x86` instructions, so a
# hand-typed byte can never disarm the gate. See `build-support/prologue_build.rs`.
[build-dependencies]
iced-x86 = { version = "1.21", default-features = false, features = [
  "std",
  "code_asm",
] }

[target.'cfg(windows)'.dependencies]
er-hook = { path = "../er-hook" }

[lints]
workspace = true
