[package]
name = "er-build-export"
version = "0.1.0"
edition = "2024"
publish = false

# Host-buildable, game-free and network-free on purpose, exactly like `er-build-import-core`:
# producing a planner share link is pure data transformation (character document -> URL), so
# every stage of it is provable by `cargo test` on Linux with no Elden Ring and no HTTP.
#
# No base64 or compression crate either. The two codecs this needs are ~60 lines each and are
# pinned to the planner's exact dialect (padded standard base64; the LZ-UTF8 stream format), so
# a dependency would buy nothing and would have to be audited against the site's decoder anyway.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# THE READER, and now a real dependency rather than only a dev one. The appearance codec
# (`er_build_import_core::sliders`) is the one piece of the document both directions need: this
# crate decodes a character's `FaceDataBuffer` into the planner's slider object, and the importer
# encodes that object back over a character's buffer. Two copies of a 200-row offset table is two
# tables to move a byte in.
#
# The edge runs the same way the dev one already did, so the shipping graph keeps its shape:
# er-build-import-core still does NOT depend on er-build-export, and nothing here can close a
# cycle.
er-build-import-core = { path = "../er-build-import-core" }

[lints]
workspace = true
