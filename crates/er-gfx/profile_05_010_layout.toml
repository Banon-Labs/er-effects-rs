[row_chrome.backing]
x = -17.3
y = 0
scale_x = 20
scale_y = 1
opacity = 1
editable = true
source = "normal non-highlighted row backing: Backing/char54 contains MENU_FL_SelectWaku, the same 56x54 Save Game-style button frame art"

[row_chrome.hit_area]
x = -17.3
y = 0
scale_x = 20
scale_y = 1
opacity = 0
editable = false
source = "invisible full-row mouse target: HitArea/char54. GridControl's hit resolver (FUN_14074b0d0) prefers a child named HitArea over Cursor, so the row stays hoverable end to end while the drive-row runtime shrinks Cursor onto the focused sub-control"

[row_chrome.cursor]
x = -17.3
y = 0
scale_x = 1
scale_y = 1
opacity = 1
editable = true
source = "outer highlighted-row cursor wrapper: row sprite 76 named Cursor / char 75; keep identity so CursorBody locks to Backing dimensions"

[row_chrome.cursor_body]
x = 0
y = 0
scale_x = 20
scale_y = 1
opacity = 1
editable = true
source = "inner highlighted-row cursor body: Cursor/char75 -> CursorBody/char73 -> MENU_FL_Select_Cursor, the same 56x54 art used by Save Game / Return to Desktop style buttons"

[row_chrome.drive_button]
x = -2
y = 0
scale_x = 0.991
scale_y = 1
opacity = 0.55
editable = true
source = "relative offset/scale/opacity shared by every DriveButton_* native frame; x/y nudge button chrome without moving drive-letter text"

[row_chrome.path_button]
x = -2
y = 0
scale_x = 1
scale_y = 1
opacity = 0.42
editable = true
source = "independent offset/scale/opacity for CurrentPathButton; lower opacity softens the oversized native outline"

