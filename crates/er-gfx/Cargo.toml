[package]
name = "er-gfx"
version = "0.1.0"
edition = "2024"
publish = false
description = "Tier-0 lossless Scaleform-GFX (uncompressed 'GFX' v11) reader/writer for Elden Ring menu .gfx files."

[lib]
# Pure-Rust, host-testable. No game/Windows dependencies.

[dependencies]
bitflags = "2.11.0"
# Shared zero-dependency content fingerprint owner.
er-game-base = { path = "../er-game-base" }

[lints]
workspace = true
