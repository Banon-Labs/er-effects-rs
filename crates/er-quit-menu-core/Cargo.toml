# Product (B): the CUSTOMIZED POST-AUTOLOAD VANILLA MENU -- everything we add to the
# game's own System>Quit tab, as one product:
#   * the AddCancelButton row cloning that CREATES the two rows, and the routing that puts
#     them ahead of the native Return-to-Desktop confirm;
#   * the "Load Character" row (character-slot switch);
#   * the "Load Character from File" row (browse for a different save container), its in-game
#     `05_010_ProfileSelect` browse surface, and the ProfileSummary preview/save-swap it
#     drives;
#   * the "Save Game" row: label substitution, the native confirm chain, the destination
#     browser and the commit;
#   * the "Quit to Desktop" row and its clean-kill path;
#   * the dim overlay that covers the game while an OS dialog is up -- the IN-GAME
#     quit-menu case ONLY (user decision 2026-07-30).
#
# DEPENDENCY DIRECTION IS ONE-WAY: er-quit-menu-core -> er-save-picker-core. This crate borrows the
# shared row model and the comdlg32 mechanism from (A) and supplies its own dim as the
# cover. (A) never references the dim, which is what keeps the direction acyclic.
#
# Product state crosses the seam as injected function pointers: see `host::install_host`.
# This crate must NOT depend on the root crate.
[package]
name = "er-quit-menu-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "er_quit_menu_core"

[dependencies]
# The shared row model, the picker config keys and the comdlg32 dialog mechanism
# (product A). `default-features = false` + an explicit `os-dialog`: a standalone
# product-(B) DLL links (A)'s SURFACES but never (A)'s boot missing-save behavior. Note
# that cargo unifies features across a build graph, so this isolation is real only in a
# build where (A)'s own DLL / the product are absent -- the runtime guarantee is that (A)'s
# boot flow arms only from an explicit entry point that this crate never calls.
er-save-picker-core = { path = "../er-save-picker-core", default-features = false, features = [
  "os-dialog",
] }
# BND4 slot walk + PlayerGameData reads for the ProfileSummary preview of a foreign save.
er-save-loader = { path = "../er-save-loader" }
# The profile-renderer table this crate's ProfileSelect opener stands on: the 10-slot table
# accessor, the renderer vtable, the native table builder and the shared `..._DIAG_ORIG` slot. The
# window the opener submits renders character models, so the table's health is a precondition of
# opening it at all -- see `profile_table_guard`. Direction stays acyclic: that crate does not
# reference this one.
er-loading-portrait-core = { path = "../er-loading-portrait-core" }
# Shared cross-platform telemetry counters (the oracle_system_quit_* / save_flow_* /
# save_dest_* / save_picker_* fields).
er-telemetry-core = { path = "../er-telemetry-core" }
# Share-link validation for the "Load Build from URL" row's field: the clipboard is only used
# when it VALIDATES, so the pure host-side parser comes with the row. Data transformation only --
# the game-side importer stays in er-build-import-runtime.
er-build-import-core = { path = "../er-build-import-core" }
# The Scaleform-GFX reader/writer that derives the two movies these rows stand on: the six-cell
# `02_040_optionsetting` grid the rows are cells of, and the `02_990` link field. Pure-Rust and
# host-testable, so it comes in on both targets -- the backdrop attestation is a host test.
er-gfx = { path = "../er-gfx" }

[target.'cfg(windows)'.dependencies]
eldenring = { path = "../../../fromsoftware-rs/crates/eldenring" }
fromsoftware-shared = { path = "../../../fromsoftware-rs/crates/shared" }
# Shared MinHook FFI + hook union. This crate contends with the product DLL on real game
# addresses (0x920c90 AddCancelButton, 0x9a4670 ProfileLoad activate, 0x875590 the
# ProfileSelect list builder, ...), so EVERY detour it installs must go through
# `register_union_hook` -- never a bare `MhHook::new`.
er-hook = { path = "../er-hook" }
# Fault-safe RAM readers, game base/rva resolution, typed game bindings.
er-game-base = { path = "../er-game-base", features = ["game-types"] }
# The save picker stages ProfileSummary records as browse rows, and the preview hash it compares
# against is the one the profile-summary crate already derives.
er-profile-summary-core = { path = "../er-profile-summary-core" }
# The game-side importer/exporter, shared with the standalone er-build-import DLL. The
# System>Quit "Load Build from URL" and "Generate Build Link" rows are the product entry
# points into it.
er-build-import-runtime = { path = "../er-build-import-runtime" }
# The reverse-engineered layout of the menu surfaces these rows live on: the `CS::MenuJob` queue
# and submit addresses the software keyboard drives, the System dialog's job-queue and window-list
# offsets, and the two `AddCancelButton` caller return addresses the row cloner tells its two call
# sites apart by. Each of those is one declaration in that crate; re-declaring any of them here
# would be a second claim about the same address (`scripts/check-rva-alias-drift.py`).
er-title-flow = { path = "../er-title-flow" }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# The assembler the build script encodes each pinned prologue with, so the bytes this crate
# byte-checks are generated from named instructions rather than transcribed.
[build-dependencies]
iced-x86 = { version = "1.21", default-features = false, features = [
  "std",
  "code_asm",
] }

# Lint parity with `../fromsoftware-rs` (root `[workspace.lints]`): stock rustc + clippy lint
# set, denied. Zero violations on the shipping target
# (`cargo xwin clippy --release --target x86_64-pc-windows-msvc --all-targets`) and on the host
# build, so the deny carries no `# DEBT:` allows.
[lints]
workspace = true
