# Thin standalone ME3-loadable shell for the `er-save-picker` feature crate (product A):
# own DllMain, own log file, individually shippable.
#
# UNLIKE `er-loading-portrait-dll`, this DLL is designed to COEXIST conservatively
# in the S6-safe subset. The user requirement (2026-07-30) is that a profile may list
# either new DLL, both, neither, and combinations with the product and other companions;
# S6 only proves the standalone shell and product-already-present stand-down case.
#   1. product (A) installs NO game-address detour at all -- its only OS hook is a
#      `WH_KEYBOARD_LL` keyboard hook, which is per-DLL and cannot collide;
#   2. if the product DLL is already loaded, this standalone shell stands down before
#      installing its host or arming the picker;
#   3. standalone-first co-load remains outside S6 proof and must be covered by the
#      later save-redirect/feature-ownership slices before claiming the full matrix; and
#   4. anything that ever does hook a game address must go through the `er-hook` union
#      (`register_union_hook` / the `er_effects_union_register` C export), never a bare
#      `MhHook::new`, so one MinHook instance owns each address and handlers chain.
# See docs/plans/save-picker-crate-extraction.md, "Hook-ownership election".
[package]
name = "er-save-picker-dll"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "er_save_picker_dll"
# `cdylib` is the ME3-loadable artifact; `rlib` keeps the tiny DLL shell testable on the
# host without pulling game deps into the test graph.
crate-type = ["cdylib", "rlib"]

[dependencies]
er-save-picker = { path = "../er-save-picker" }
er-save-redirect = { path = "../er-save-redirect" }
# Tier A only (zero external deps, host-buildable): the fresh-per-process log writer, so this
# shell's log describes exactly one run instead of accumulating across launches.
er-game-base = { path = "../er-game-base" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_System_LibraryLoader",
] }

# Lint parity with `../fromsoftware-rs` (root `[workspace.lints]`): stock rustc + clippy lint
# set, denied. Zero violations on the shipping target
# (`cargo xwin clippy --release --target x86_64-pc-windows-msvc --all-targets`) and on the host
# build, so the deny carries no `# DEBT:` allows.
[lints]
workspace = true
