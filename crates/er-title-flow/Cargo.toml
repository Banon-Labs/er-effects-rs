# Title/autoload/switch flow feature crate, extracted from the root er-effects-rs DLL
# (docs/plans/title-flow-crate-extraction.md). The product autoload tick, b78 guard,
# switch-slot control, profile-select flow, and the mms18 finalize machinery live here.
# Product state crosses the seam through `host::install_host` function pointers
# (er-loading-portrait precedent); this crate must NOT depend on the root crate.
[package]
name = "er-title-flow"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "er_title_flow"

[dependencies]
er-telemetry = { path = "../er-telemetry" }
# Tier A is host-safe and keeps shared RVA constants available to host-compiled modules;
# `game-types` only pulls typed game bindings on Windows because er-game-base gates them there.
er-game-base = { path = "../er-game-base", features = ["game-types"] }

[target.'cfg(windows)'.dependencies]
eldenring = { path = "../../../fromsoftware-rs/crates/eldenring" }
fromsoftware-shared = { path = "../../../fromsoftware-rs/crates/shared" }
er-hook = { path = "../er-hook" }
er-loading-portrait = { path = "../er-loading-portrait" }
er-save-loader = { path = "../er-save-loader" }
er-tpf = { path = "../er-tpf" }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_SystemServices",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
