[package]
name = "er-d3d12-compositor"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "er_d3d12_compositor"

[target.'cfg(windows)'.dependencies]
er-hook = { path = "../er-hook" }
er-loading-bar = { path = "../er-loading-bar" }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
