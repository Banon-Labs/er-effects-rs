[package]
name = "er-build-import-core"
version = "0.1.0"
edition = "2024"
publish = false

# Host-buildable and game-free on purpose: this crate is pure data transformation
# (planner JSON -> concrete item grants) so the whole mapping can be proven by
# `cargo test` with no Elden Ring, no injection and no network.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `build.rs` turns the planner's captured `q9` offset table into the Rust one, so it needs the
# same JSON reader the crate itself uses. No new dependency reaches the shipping graph: this is
# the version already resolved above, built once for the host.
[build-dependencies]
serde_json = "1"

[lints]
workspace = true
