[workspace]
members = [
  "crates/er-effects-rs",
  "crates/er-hook",
  "crates/er-game-base",
  "crates/er-telemetry",
  "crates/er-title-flow",
  "crates/er-telemetry-dll",
  "crates/er-reload-trace-dll",
  "crates/er-input-harness-dll",
  "crates/er-ags-stub",
  "crates/er-inventory-sort-dll",
  "crates/er-better-refills-dll",
  "crates/er-armament-icons",
  "crates/er-net-effects-dll",
  "crates/er-save-disable-dll",
  "crates/er-save-suppress",
  "crates/mushroom-man-runtime",
  "crates/effects-data",
  "crates/er-gfx",
  "crates/er-loading-bar",
  "crates/er-d3d12-compositor",
  "crates/er-loading-bar-dll",
  "crates/er-loading-portrait",
  "crates/er-loading-portrait-dll",
  # Save-picker crate extraction (docs/plans/save-picker-crate-extraction.md).
  # (A) the DLL-drawn boot picker + the shared row model + the OS-native dialog surface;
  # (B) the customized System>Quit menu, which depends on (A) one way. Each ships as a
  # feature crate plus a thin standalone ME3-loadable shell.
  "crates/er-save-picker",
  "crates/er-save-picker-dll",
  "crates/er-save-redirect",
  "crates/er-quit-menu",
  "crates/er-quit-menu-dll",
  "crates/er-safe-input",
  "crates/er-save-loader",
  "crates/er-tpf",
  "crates/erpx-rs",
  "crates/soulsformats",
  # Host-only shader subcrates (naga/wgpu/bevy). NOT depended on by the root
  # `er-effects-rs` cdylib, so `cargo xwin check` (which selects only the root
  # package) never cross-compiles them into the game DLL; built only when
  # targeted explicitly (`cargo check -p er-shaderkit ...`).
  "crates/er-shaderkit",
  "crates/er-flver",
  "crates/er-objectkit",
  "tools/er-param-inspect",
  "tools/bevy-shader-lab",
  "tools/er-shaderlab",
  "tools/er-shader-viewer",
]
resolver = "2"
default-members = ["crates/er-effects-rs"]
