[workspace]
members = [
  "crates/er-quickload",
  # Offline answer to the exact question the DLL now asks before it will wait on a Continue slot:
  # which character slots does this save container actually hold? Same parser
  # (`er_save_loader::bnd4::active_character_slots`), so a runtime refusal can be predicted and
  # reviewed without launching the game. Host-buildable and game-free.
  "tools/er-slot-truth",
  # One vocabulary for naming a key in a config file, plus the reload decision that makes an
  # edit take effect without a restart. Extracted after a hard-coded VK_F7 in er-invasion-warp
  # collided with another mod's default and warped a live session, with no config key on either
  # side to move. Host-buildable and game-free: the key table, the parser and the reload
  # decision are all `cargo test`-able on Linux.
  "crates/er-hotkey-config",
  "crates/er-hook",
  "crates/er-game-base",
  "crates/er-boot-profiler",
  "crates/er-telemetry-core",
  "crates/er-title-flow",
  "crates/er-telemetry",
  "crates/er-crash-logging-core",
  "crates/er-crash-logging",
  "crates/er-reload-trace",
  "crates/er-input-harness",
  # Removes ELDEN RING's requirement that its window be FOCUSED to accept input, so an
  # agent-driven runtime run does not have to steal the user's focus to be valid. Installs no
  # detour: the whole intervention is one byte store into the global behind
  # `Game.Debug.IsEnableControlOnDisactiveWindow`, which `CS::CSPadStep::STEP_Update` re-reads
  # every frame. Separate `[[natives]]` entry, enabled by presence.
  "crates/er-focus-input",
  # The agent trace detours the SHIPPING DLL used to install unconditionally: the sole
  # `msbResCap` writer, `STEP_LoadListWait`, and the three DLC virtual-root entry points. All
  # observe-and-forward, none feeding an `oracle_*` field, so every player carried five detours
  # for a log nothing read back. Same contract as er-input-harness: a separate `[[natives]]`
  # entry, enabled by presence, omitted from a production profile.
  "crates/er-diag-harness",
  "crates/er-ags-stub",
  "crates/er-inventory-sort",
  "crates/er-better-refills",
  # Hotkey that marks every auto-refillable item refill / no-refill in one press, cycling.
  # Runs from inside the storage box dialog's own update, which is what confines it to the only
  # menu with refill options rather than a check that could be got wrong.
  "crates/er-refill-all",
  "crates/er-armament-icons",
  "crates/er-net-effects",
  # Hotkey toggle that keeps every loaded enemy under a configured SpEffect. Standalone
  # shell with no product dependency: a DirectInput keyboard read and a FrameBegin sweep.
  "crates/er-enemynpc-effects",
  # Stack layer 1 of the "become an NPC" mod: the hot-reloading config file, the keyboard and
  # controller hotkeys, and the seam the possession engine plugs into. Installs no detour and
  # writes no game memory -- it polls its two hotkeys from a FrameBegin task -- so nothing here
  # depends on the reverse engineering the later layers need.
  "crates/er-npc-possess",
  "crates/er-player-name-filter",
  # While you are invading, fellow invaders stop being lock-on targets. One detour on the
  # lock-on system's point-owner resolver, which answers "no character owns this point" for
  # another invader -- its own value for a point with nobody behind it. Standalone shell with
  # no product dependency; writes no game memory and touches no other targeting rule.
  "crates/er-save-disable",
  "crates/er-save-suppress",
  "crates/mushroom-man-runtime",
  "crates/er-death-persist",
  "crates/effects-data",
  "crates/er-gfx",
  "crates/er-scaleform-hooks",
  # The boot/loading cover's optional screenshot background: disk discovery (configured path,
  # pre-decoded cache, newest local Steam screenshot), the WIC decode, and the aspect-cover fill +
  # bar vignette. Extracted from er-quickload's boot_progress.rs, which had passed the hard Rust
  # file-size limit; it left first because it reads no game memory, writes no counter and installs
  # no hook, so nothing about it needed to live in the DLL crate.
  "crates/er-boot-background",
  "crates/er-loading-bar-core",
  "crates/er-d3d12-compositor",
  "crates/er-loading-bar",
  "crates/er-loading-portrait-core",
  "crates/er-loading-portrait",
  # The loading cover's one-way release fade at the D3D12 level: its command objects, its root
  # signature / PSO / texture slot, and the single alpha-blended full-screen frame it composites.
  # Holds no product decision -- when to fade, at what alpha and what the frame looks like all stay
  # in er-quickload, which feeds the pixels through a rasterize callback.
  "crates/er-cover-fade",
  # Save-picker crate extraction (docs/plans/save-picker-crate-extraction.md).
  # (A) the DLL-drawn boot picker + the shared row model + the OS-native dialog surface;
  # (B) the customized System>Quit menu, which depends on (A) one way. The product links
  # er-quit-menu-core into er_quickload.dll; er-quit-menu is an optional harness only.
  "crates/er-save-picker-core",
  "crates/er-save-picker",
  "crates/er-save-redirect",
  "crates/er-quit-menu-core",
  # `CS::ProfileSummary` -- the ten in-memory character records every character-identity
  # surface reads (the title Continue row, the System>Quit load rows, the ProfileSelect list,
  # the loading-screen portrait). Was four files of the er-quickload shim, one verb each.
  "crates/er-profile-summary-core",
  "crates/er-quit-menu",
  # World-map invasion-spawn warp targets (bd er-effects-rs-5es,
  # docs/plans/world-map-invasion-warp.md). Feature crate + thin ME3-loadable shell, same
  # split as er-loading-portrait-core / er-loading-portrait.
  # The build watermark every profile draws in the top-right: which mods are loaded, and whether
  # any of them is an older PUBLISHED release than main's tip.
  "crates/er-build-watermark-core",
  "crates/er-build-watermark",
  "crates/er-invasion-warp-core",
  "crates/er-invasion-warp",
  # Which mods in this profile are fighting over the same key, and does the game already use it.
  # A passive observer: it hooks the input-read APIs, attributes each call to the module it came
  # from, and prints ONE warning once the profile has settled. Every detour chains straight back
  # to the original -- it swallows no input, injects none, and writes no game memory.
  "crates/er-hotkey-conflicts",
  # A walkable route to every other player in the session, drawn on the ground and following the
  # terrain, with a direction arrow when the navmesh cannot reach them. Standalone shell: reads
  # the roster, asks the engine's own Havok-AI navmesh, draws through the shared overlay host.
  "crates/er-invasion-path",
  # Crash guards for faults only Seamless Co-op's networking mode reaches. Standalone shell with
  # no product dependency: every guard is a null-container intercept on a vanilla function.
  "crates/er-seamless-bugfixes",
  # Three death conveniences, each one rewritten byte of the game's own code: keep your
  # runes, keep an active rune arc, and end the YOU DIED fade at once. Ported from
  # er-convenient-deaths, whose own offsets are dead on every build here. Each patch is off
  # until a DLL-adjacent config key asks for it, because the three are separate decisions.
  "crates/er-convenient-deaths",
  # Import a build from an er-build-planner share link: pure host-side data
  # transformation (planner JSON -> item grants), no game or network deps.
  "crates/er-build-import-core",
  # Game-side half of the importer (catalogue/grant/equip/stats + the WinHTTP fetch), shared by the
  # standalone shell below and the product DLL's System>Quit "Load Build from URL" row.
  "crates/er-build-import-runtime",
  "crates/er-build-import",
  # The other direction: WRITE an er-build-planner `?i=` share link from a character
  # document. Self-contained links carry the whole build, so producing one needs no account
  # and no network -- pure host-side data transformation, same as er-build-import-core.
  "crates/er-build-export",
  "crates/er-safe-input",
  "crates/er-save-loader",
  "crates/er-tpf",
  "crates/erpx-rs",
  "crates/soulsformats",
  # Host-only shader subcrates (naga/wgpu/bevy). NOT depended on by the root
  # `er-quickload` cdylib, so `cargo xwin check` (which selects only the root
  # package) never cross-compiles them into the game DLL; built only when
  # targeted explicitly (`cargo check -p er-shaderkit ...`).
  "crates/er-shaderkit",
  "crates/er-flver",
  "crates/er-objectkit",
  "tools/er-param-inspect",
  "tools/bevy-shader-lab",
  "tools/er-shaderlab",
  "tools/er-shader-viewer",
]
resolver = "2"
default-members = ["crates/er-quickload"]

# LINT PARITY WITH `../fromsoftware-rs` (2026-08-21).
#
# The user's requirement is that this workspace be AT LEAST as strict as the parent project.
# Upstream has no `clippy.toml`, no `[lints]` table, and exactly one `#![allow]` in its whole
# tree -- its entire strictness is `RUSTFLAGS=-Dwarnings` + `RUSTDOCFLAGS=-Dwarnings` around
# `cargo clippy --all-targets --no-deps` in `.github/workflows/rust.yml`. So parity is "stock
# lint set, denied", and this table is the declarative equivalent of those env vars.
#
# WHY BOTH ENTRIES, when `rust.warnings` already covers clippy lints under clippy:
# a blanket `-Awarnings` in `.cargo/config.toml` DEFEATS `rust.warnings = "deny"` (same lint
# group, and the config's flag is applied later) but does NOT defeat `clippy.all = "deny"`
# (a named group beats the blanket allow). Measured 2026-08-21 across four configurations
# with forced rebuilds. Keeping both means that if `-Awarnings` is ever reintroduced -- or
# cargo-xwin re-propagates it, which it does -- the clippy half degrades gracefully instead
# of silently switching every lint in the workspace off.
#
# `priority = -1` makes these groups apply BEFORE any single-lint entry, so a crate that is
# not yet at parity can allow specific lints in its own `[lints]` table without abandoning
# the deny. Every such allow must carry a `# DEBT:` comment and is enforced by
# `scripts/check-lint-parity.py`.
[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# LOCAL PATCH of hudhook 0.9.2, vendored at third_party/hudhook.
#
# It lives under `third_party/` rather than `vendor/` because that is the directory this
# repo's own linters already skip (scripts/check-no-lossy-utf8.py and friends), and a house
# rule applied to somebody else's source is a rule that has to be satisfied again every time
# the crate is re-vendored.
#
# Upstream's `Pipeline::new` starts with `GetClientRect(swap_chain.GetDesc().OutputWindow).unwrap()`.
# Under Wine/Proton with vkd3d-proton that HWND is sometimes not a live window and the call returns
# 0x80070578 ERROR_INVALID_WINDOW_HANDLE, so the unwrap panics -- inside an `extern "system"`
# callback the game owns, which is an abort, not a caught error.
#
# MEASURED 2026-08-29, in two different modules and therefore not a property of either:
# er_build_watermark died that way 229ms after the first backbuffer draw, and with that shell
# excluded er_net_effects -- the next module to win the overlay-host claim -- died identically at
# +2060ms. A cosmetic overlay must not be able to end the process.
#
# The patch is two functions: `util::try_win_size` returns `Option` instead of unwrapping, and
# `Pipeline::new` returns `Err(E_HANDLE)` when the window cannot be sized, which puts the failure
# down hudhook's own "pipeline not initialised" path. 0.9.2 is the latest published version, so
# there is nothing to upgrade to instead.
[patch.crates-io]
hudhook = { path = "third_party/hudhook" }
